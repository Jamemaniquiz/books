<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller login — BookNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper-light:#F8F3E7; --ink:#26211A; --ink-soft:#5B5344;
    --spine:#35493C; --spine-dark:#263329; --spine-light:#4A6151;
    --brick:#A8402A; --brick-dark:#8A3220; --line:#D9CDB2; --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(155deg, var(--spine) 0%, var(--spine-dark) 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; padding:24px;
  }
  .box{ background:var(--paper-light); border-radius:6px; width:100%; max-width:380px; padding:36px 32px; box-shadow:0 20px 50px rgba(0,0,0,0.3); }
  .brand{ text-align:center; margin-bottom:6px; }
  .brand-mark{ font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:26px; color:var(--spine-dark); }
  .lock{ text-align:center; font-size:22px; margin-bottom:14px; }
  h2{ font-family:'Fraunces',serif; font-size:18px; margin:0 0 4px 0; text-align:center; color:var(--ink); }
  .sub{ font-size:12.5px; color:var(--ink-soft); text-align:center; margin-bottom:20px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .field input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:4px; font-size:14px; font-family:inherit; background:var(--white); color:var(--ink); }
  .field input:focus{ outline:2px solid var(--spine-light); outline-offset:1px; }
  .btn{ width:100%; padding:12px; border-radius:4px; border:none; font-weight:700; font-size:14.5px; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--brick); color:var(--white); }
  .btn-primary:hover{ background:var(--brick-dark); }
  .err{ background:#F4E4DD; border:1px solid #E2B7A6; color:var(--brick-dark); padding:10px 12px; border-radius:4px; font-size:13px; margin-bottom:14px; display:none; }
</style>
</head>
<body>
  <div class="box">
    <div class="brand"><div class="brand-mark">BookNest</div></div>
    <div class="lock">🔒</div>
    <h2>Seller login</h2>
    <div class="sub">This account manages inventory, sales, and orders.</div>
    <div class="err" id="err"></div>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@email.com"></div>
    <div class="field"><label>Password</label><input type="password" id="pass" placeholder="••••••••"></div>
    <button class="btn btn-primary" id="loginBtn">Log in</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-data.js"></script>
  <script>
    whenAuthReady((user, role)=>{
      if(user && role==='seller') window.location.href = 'admin.html';
    });

    document.getElementById('loginBtn').addEventListener('click', async ()=>{
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      const err = document.getElementById('err');
      err.style.display = 'none';
      if(!email || !pass){ err.textContent='Please enter your email and password.'; err.style.display='block'; return; }
      try{
        await sellerLogin(email, pass);
        window.location.href = 'admin.html';
      }catch(e){
        err.textContent = e && e.message ? e.message : 'Incorrect email or password.';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
