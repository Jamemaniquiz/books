<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookNest — Pre-loved Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE7D8;
    --paper-light:#F8F3E7;
    --ink:#26211A;
    --ink-soft:#5B5344;
    --spine:#35493C;
    --spine-dark:#263329;
    --spine-light:#4A6151;
    --brick:#A8402A;
    --brick-dark:#8A3220;
    --brass:#9C7A34;
    --line:#D9CDB2;
    --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.serif{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* SPINE NAV */
  .spine{
    width:180px;
    flex-shrink:0;
    background:var(--spine);
    color:var(--white);
    display:flex;
    flex-direction:column;
    padding:28px 0;
    position:relative;
  }
  .spine::after{
    content:"";
    position:absolute;
    right:0;top:0;bottom:0;
    width:6px;
    background:linear-gradient(90deg, rgba(0,0,0,0.18), transparent);
  }
  .brand{
    padding:0 22px 24px 22px;
    border-bottom:1px solid rgba(255,255,255,0.14);
    margin-bottom:18px;
  }
  .brand-mark{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:26px;
    line-height:1.1;
    color:var(--white);
  }
  .brand-sub{
    font-size:11px;
    letter-spacing:0.04em;
    color:rgba(255,255,255,0.55);
    margin-top:6px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 22px;
    color:rgba(255,255,255,0.72);
    cursor:pointer;
    font-size:14.5px;
    border-left:3px solid transparent;
    transition:background 0.15s, color 0.15s;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:var(--white); }
  .nav-item.active{
    background:rgba(255,255,255,0.09);
    color:var(--white);
    border-left:3px solid var(--brick);
  }
  .nav-badge{
    margin-left:auto;
    background:var(--brick);
    color:var(--white);
    font-size:11px;
    padding:1px 7px;
    border-radius:9px;
    min-width:18px;
    text-align:center;
  }
  .spine-footer{
    margin-top:auto;
    padding:14px 22px 0 22px;
    font-size:11.5px;
    color:rgba(255,255,255,0.4);
    border-top:1px solid rgba(255,255,255,0.1);
    padding-top:14px;
  }

  /* MAIN */
  .main{ flex:1; padding:36px 44px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .page-head h1{ font-size:30px; margin:0; }
  .page-head p{ margin:4px 0 0 0; color:var(--ink-soft); font-size:14.5px; }

  .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .genre-select{ min-width:150px; cursor:pointer; }
  input[type=text], input[type=number], input[type=tel], input[type=password], select, textarea{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 12px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    border-radius:3px;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--spine-light); outline-offset:1px; }

  .btn{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:9px 16px;
    border-radius:3px;
    border:1px solid transparent;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary{ background:var(--brick); color:var(--white); }
  .btn-primary:hover{ background:var(--brick-dark); }
  .btn-primary:disabled{ background:#C7BBA5; cursor:not-allowed; }
  .btn-outline{ background:transparent; border-color:var(--ink); color:var(--ink); }
  .btn-outline:hover{ background:var(--ink); color:var(--white); }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
  .btn-ghost:hover{ border-color:var(--ink); color:var(--ink); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }
  .btn-danger{ background:transparent; color:var(--brick); border-color:var(--brick); }
  .btn-danger:hover{ background:var(--brick); color:var(--white); }

  .notice{
    background:#F4E4DD;
    border:1px solid #E2B7A6;
    color:var(--brick-dark);
    padding:16px 20px;
    border-radius:3px;
    font-size:13.5px;
    line-height:1.6;
    margin-bottom:24px;
  }
  .notice b{ display:block; font-size:12px; letter-spacing:0.06em; margin-bottom:4px; }

  /* PROMO BANNER CAROUSEL */
  .banner-carousel{
    position:relative; overflow:hidden; border-radius:8px; margin-bottom:26px;
    border:1px solid var(--line); box-shadow:0 2px 10px rgba(38,33,26,0.06);
  }
  .banner-track{ display:flex; transition:transform 0.65s cubic-bezier(.45,0,.2,1); }
  .banner-slide{
    flex:0 0 100%; display:flex; align-items:center; gap:20px;
    padding:30px 36px 34px 36px; min-height:96px; color:var(--white);
  }
  .banner-slide.tone-spine{ background:linear-gradient(120deg, var(--spine), var(--spine-dark) 130%); }
  .banner-slide.tone-brick{ background:linear-gradient(120deg, var(--brick), var(--brick-dark) 130%); }
  .banner-slide.tone-brass{ background:linear-gradient(120deg, var(--brass), #6f5624 130%); }
  .banner-slide.tone-spine-light{ background:linear-gradient(120deg, var(--spine-light), var(--spine-dark) 130%); }
  .banner-emoji{ font-size:38px; line-height:1; flex-shrink:0; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.15)); }
  .banner-title{ font-family:'Fraunces',serif; font-weight:600; font-size:21px; margin-bottom:5px; letter-spacing:-0.01em; }
  .banner-sub{ font-size:13.5px; line-height:1.55; opacity:0.92; max-width:560px; }
  .banner-dots{ position:absolute; bottom:11px; left:0; right:0; display:flex; justify-content:center; gap:7px; }
  .banner-dot{
    width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.45);
    cursor:pointer; transition:background .15s, transform .15s; border:none; padding:0;
  }
  .banner-dot.active{ background:var(--white); transform:scale(1.3); }
  @media (max-width:600px){
    .banner-slide{ padding:22px 20px 28px 20px; gap:14px; }
    .banner-emoji{ font-size:30px; }
    .banner-title{ font-size:17px; }
    .banner-sub{ font-size:12.5px; }
  }

  /* FEATURED SHELVES (Promo / Brand New) */
  .shelf-section{ margin-bottom:30px; }
  .shelf-heading{ display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .shelf-heading h2{ font-size:19px; margin:0; color:var(--spine-dark); }
  .shelf-icon{ font-size:18px; line-height:1; }
  .shelf-badge{
    background:var(--brick); color:var(--white); font-size:10.5px; font-weight:700;
    letter-spacing:0.03em; text-transform:uppercase; padding:3px 9px; border-radius:10px;
  }
  .shelf-row{
    display:flex; gap:18px; overflow-x:auto; padding-bottom:10px;
    scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
  }
  .shelf-row::-webkit-scrollbar{ height:7px; }
  .shelf-row::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .shelf-row .card{ flex:0 0 240px; scroll-snap-align:start; }
  .shelf-row .cover{ height:260px; }

  .promo-pill{
    align-self:flex-start; background:rgba(168,64,42,0.12); color:var(--brick-dark);
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px; margin-bottom:2px;
  }

  /* GRID */
  .genre-section{ margin-bottom:34px; }
  .genre-section:last-child{ margin-bottom:0; }
  .genre-heading{
    display:flex; align-items:baseline; gap:10px;
    margin-bottom:14px; padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .genre-heading h2{
    font-size:19px; margin:0; color:var(--spine-dark);
  }
  .genre-count{
    font-size:12px; color:var(--ink-soft); letter-spacing:0.02em;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
    gap:28px;
  }
  .card{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:3px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .shelf-tab{
    position:absolute;
    top:10px; left:0;
    background:var(--spine);
    color:var(--white);
    font-size:10.5px;
    letter-spacing:0.03em;
    padding:3px 9px 3px 8px;
    border-radius:0 3px 3px 0;
    z-index:2;
  }
  .cover{
    height:380px;
    background:linear-gradient(160deg, var(--spine-light), var(--spine-dark));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    position:relative;
  }
  .cover img{ width:100%; height:100%; object-fit:cover; image-rendering:-webkit-optimize-contrast; image-rendering:high-quality; }
  .cover-fallback{
    text-align:center;
    color:rgba(255,255,255,0.92);
  }
  .cover-fallback .t{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; line-height:1.25; }
  .cover-fallback .a{ font-size:10.5px; margin-top:8px; color:rgba(255,255,255,0.6); letter-spacing:0.03em; text-transform:uppercase; }
  .stock-flag{
    position:absolute; top:10px; right:10px;
    background:var(--brass); color:var(--white);
    font-size:10px; font-weight:700; letter-spacing:0.03em;
    padding:3px 7px; border-radius:2px;
  }
  .stock-flag.out{ background:#8a8a8a; }
  .card-body{ padding:14px 15px 15px 15px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .price{ color:var(--brick); font-weight:700; font-size:14.5px; }
  .title{ font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; line-height:1.25; margin:1px 0 2px 0; }
  .meta{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .card-actions{ margin-top:10px; display:flex; gap:8px; }
  .card-actions .btn{ flex:1; justify-content:center; }

  .empty{ padding:60px 20px; text-align:center; color:var(--ink-soft); }
  .empty h3{ margin-bottom:8px; }

  /* CART / TABLE */
  .cart-row{
    display:grid;
    grid-template-columns:64px 1fr 110px 90px 90px 32px;
    gap:14px;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-row .mini-cover{ width:48px; height:64px; border-radius:2px; background:linear-gradient(160deg, var(--spine-light), var(--spine-dark)); }
  .cart-row .mini-cover img{ width:100%; height:100%; object-fit:cover; border-radius:2px; }
  .qty-input{ width:56px; text-align:center; }
  .cart-total-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 0 0 0; margin-top:6px;
  }
  .cart-total-bar .sum{ font-family:'Fraunces',serif; font-size:22px; }

  .panel{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:3px;
    padding:24px;
  }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-grid.full{ grid-template-columns:1fr; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-span2{ grid-column:1/-1; }

  table.admin-table{ width:100%; border-collapse:collapse; }
  table.admin-table th{ text-align:left; font-size:11.5px; letter-spacing:0.04em; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line); }
  table.admin-table td{ padding:10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  table.admin-table tr:hover td{ background:rgba(53,73,60,0.04); }

  .order-card{ border:1px solid var(--line); border-radius:3px; margin-bottom:14px; background:var(--paper-light); overflow:hidden; }
  .order-head{ display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background:rgba(53,73,60,0.05); border-bottom:1px solid var(--line); flex-wrap:wrap; gap:8px; }
  .order-id{ font-family:'Fraunces',serif; font-weight:600; }
  .status-pill{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:10px; letter-spacing:0.02em; }
  .status-Pending{ background:#F1DCC4; color:#8A5A1F; }
  .status-Paid{ background:#D8E6D9; color:#2E5A34; }
  .status-Shipped{ background:#D6E1EC; color:#2A4A6B; }
  .status-Cancelled{ background:#E9D6D6; color:#8A2E2E; }
  .order-body{ padding:14px 18px; font-size:13.5px; }
  .order-body .line{ display:flex; justify-content:space-between; padding:3px 0; color:var(--ink-soft); }
  .order-actions{ padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(38,33,26,0.55);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--paper-light); border-radius:4px; max-width:560px; width:100%;
    padding:28px; max-height:88vh; overflow-y:auto;
  }
  .modal h2{ margin-top:0; font-size:22px; }
  .modal-close{ float:right; cursor:pointer; font-size:20px; color:var(--ink-soft); line-height:1; background:none;border:none; }

  .photo-count-badge{
    position:absolute; bottom:8px; left:8px;
    background:rgba(38,33,26,0.7); color:var(--white);
    font-size:10px; font-weight:700; padding:3px 7px; border-radius:2px;
  }

  /* Book detail modal */
  .book-detail-main-img{
    width:100%; aspect-ratio:3/4; max-height:640px; object-fit:cover; border-radius:4px;
    cursor:zoom-in; display:block;
    image-rendering:-webkit-optimize-contrast; image-rendering:high-quality;
  }
  .book-detail-noimg{
    width:100%; aspect-ratio:3/4; max-height:640px; border-radius:4px; background:linear-gradient(160deg, var(--spine-light), var(--spine-dark));
    color:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .book-detail-thumbs{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .book-detail-thumb{
    width:64px; height:84px; object-fit:cover; border-radius:2px; cursor:pointer;
    border:2px solid transparent; opacity:0.7;
  }
  .book-detail-thumb:hover{ opacity:1; }
  .book-detail-thumb.active{ border-color:var(--brick); opacity:1; }
  .book-detail-tags{ display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .book-detail-tags .tag{
    background:rgba(53,73,60,0.08); color:var(--spine-dark);
    font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:10px;
  }
  .book-detail-desc{
    margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
    font-size:13.5px; line-height:1.65; color:var(--ink); white-space:pre-wrap;
  }

  /* Lightbox (click any photo to enlarge) */
  .lightbox-backdrop{
    position:fixed; inset:0; background:rgba(15,13,10,0.85);
    display:flex; align-items:center; justify-content:center; z-index:80; padding:24px;
    cursor:zoom-out;
  }
  .lightbox-box{ max-width:min(680px, 92vw); max-height:90vh; text-align:center; cursor:default; position:relative; }
  .lightbox-img{ max-width:100%; max-height:80vh; border-radius:4px; display:block; margin:0 auto; }
  .lightbox-caption{ color:var(--white); font-size:13px; margin-top:10px; }
  .lightbox-close{
    position:absolute; top:-14px; right:-14px; width:32px; height:32px; border-radius:50%;
    background:var(--white); color:var(--ink); border:none; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .lock-screen{ max-width:340px; margin:60px auto; text-align:center; }
  .lock-screen .field{ margin:16px 0; text-align:left; }

  .pay-method{
    border:1px solid var(--line); border-radius:3px; padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; gap:10px; cursor:pointer;
  }
  .pay-method.selected{ border-color:var(--spine); background:rgba(53,73,60,0.06); }

  .confirm-box{ text-align:center; padding:20px 0; }
  .confirm-box .big{ font-family:'Fraunces',serif; font-size:20px; margin:10px 0 4px 0; }

  ::placeholder{ color:#B3A98F; }

  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .spine{ width:100%; flex-direction:row; overflow-x:auto; padding:10px 0; }
    .brand{ display:none; }
    .nav-item{ padding:10px 16px; white-space:nowrap; border-left:none; border-bottom:3px solid transparent; }
    .nav-item.active{ border-left:none; border-bottom:3px solid var(--brick); }
    .spine-footer{ display:none; }
    .main{ padding:22px 18px; }
    .cart-row{ grid-template-columns:48px 1fr; grid-template-areas:"cover title" "cover meta" "cover controls"; row-gap:4px; }
    .form-grid{ grid-template-columns:1fr; }
  }

  @media (max-width: 600px) {
    .modal {
      max-width: 100vw;
      width: 100%;
      max-height: 90vh;
      padding: 20px;
      border-radius: 12px 12px 0 0;
      margin: 0 auto auto auto;
    }

    .modal-backdrop {
      padding: 0;
      align-items: flex-end;
      background: rgba(38, 33, 26, 0.6);
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .modal-close {
      float: right;
      font-size: 24px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }

    .field input[type="text"],
    .field input[type="tel"],
    .field textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: inherit;
    }

    #ck-proof-preview {
      height: 100px;
      border-radius: 6px;
      padding: 10px;
    }

    #ck-proof-preview img {
      border-radius: 6px;
    }

    .btn {
      padding: 12px 16px;
      font-size: 15px;
      width: 100%;
    }

    .btn.btn-primary {
      margin-top: 12px;
    }

    .meta {
      font-size: 12px;
      line-height: 1.5;
    }

    .cart-row {
      grid-template-columns: 40px 1fr 40px;
      gap: 10px;
      padding: 12px 0;
    }

    .cart-row .mini-cover {
      width: 40px;
      height: 54px;
    }

    .qty-input {
      width: 45px;
      padding: 6px 4px;
      font-size: 13px;
    }

    .cart-total-bar {
      font-size: 14px;
      padding: 12px 0 0 0;
    }

    .cart-total-bar .sum {
      font-size: 18px;
    }

    .panel {
      padding: 16px;
      border-radius: 8px;
    }

    .confirm-box {
      padding: 16px 0;
    }

    .confirm-box .big {
      font-size: 18px;
    }
  }

  @media (max-width: 380px) {
    .modal {
      padding: 16px;
    }

    .modal h2 {
      font-size: 16px;
    }

    .field input[type="text"],
    .field input[type="tel"],
    .field textarea {
      padding: 8px 10px;
      font-size: 14px;
    }

    #ck-proof-preview {
      height: 80px;
      font-size: 11px;
    }

    .btn {
      padding: 10px 12px;
      font-size: 13px;
    }

    .meta {
      font-size: 11px;
    }

    .cart-row {
      grid-template-columns: 35px 1fr 35px;
      gap: 8px;
      padding: 10px 0;
    }

    .cart-row .mini-cover {
      width: 35px;
      height: 47px;
    }

    .panel {
      padding: 12px;
    }
  }

</style>
</head>
<body>

<div id="root"></div>

<script src="app.js"></script>
<script>
(function(){

  // ---------- storage: shared with the seller admin app ----------
  // This page reads the SAME book records the seller manages in
  // inventory.html (same localStorage key, same browser/device). No
  // separate catalog, no login for buyers — orders are written to their
  // own key so the seller can review them from the password-protected
  // Admin > Orders page.

  function readLocal(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function writeLocal(key, value){
    try{
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    }catch(e){
      console.error('[BookNest shop] save failed for', key, e);
      showToast('Could not save — your browser storage may be full.');
      return false;
    }
  }

  function loadCatalog(){ return readLocal(BOOKS_KEY, []); }
  function saveCatalog(books){ return writeLocal(BOOKS_KEY, books); }
  function loadOrders(){ return readLocal(ORDERS_KEY, []); }
  function saveOrders(orders){ return writeLocal(ORDERS_KEY, orders); }

  // A book is available to buy if it has stock left beyond anything the
  // seller has already put on layaway (mirrors the admin app's own rule).
  function availableStock(book){
    const holds = Array.isArray(book.layawayHolds) ? book.layawayHolds : [];
    return Math.max(0, (Number(book.stock)||0) - holds.length);
  }

  // "Brand New" reads off the same condition field the seller already sets
  // per book in Inventory — no separate setup needed.
  function isBrandNew(book){
    return (book.condition||'').trim().toLowerCase()==='brand new';
  }
  // "On Promo" is a lightweight flag (book.promo === true). It isn't in the
  // Inventory admin UI yet — see the note at the bottom of this file for how
  // to flip it on for a book in the meantime.
  function isPromo(book){
    return !!book.promo;
  }

  const uid = (p) => p + Math.random().toString(36).slice(2,9);
  const peso = (n) => 'PHP ' + Number(n).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});

  // ---------- state ----------
  let state = {
    view: 'shop',
    books: loadCatalog(),
    orders: loadOrders(),
    cart:{}, // id -> qty  (in-memory only, resets on reload)
    search:'',
    genreFilter:'',
    checkoutOpen:false,
    lastOrder:null,
    trackId:'',
    trackedOrder:undefined, // undefined = not searched yet, null = not found
    toast:null,
    viewingBookId:null,   // book detail modal (multiple photos + full details)
    viewingImageIndex:0,  // which photo is showing large inside that modal
    lightbox:null         // {src, title} — fullscreen photo viewer, used by both
                           // the book detail modal and the Payment info QR code
  };

  function setState(patch){ state = {...state, ...patch}; render(); }

  function showToast(msg){
    setState({toast:msg});
    setTimeout(()=>{ if(state.toast===msg) setState({toast:null}); }, 2600);
  }

  // Refresh the catalog from storage each time we come back to the shop
  // view, so stock the seller just changed in Inventory shows up here too.
  function refreshCatalog(){
    setState({books: loadCatalog()});
  }

  // ---------- cart logic ----------
  function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
  function cartItems(){
    return Object.entries(state.cart).map(([id,qty])=>{
      const book = state.books.find(b=>b.id===id);
      return book ? {...book, qty} : null;
    }).filter(Boolean);
  }
  function cartTotal(){ return cartItems().reduce((sum,i)=>sum+i.price*i.qty,0); }

  function addToCart(id){
    const book = state.books.find(b=>b.id===id);
    if(!book) return;
    const current = state.cart[id]||0;
    if(current >= availableStock(book)){ showToast('No more stock available'); return; }
    setState({cart:{...state.cart, [id]:current+1}});
    showToast('Added to cart');
  }
  function setCartQty(id, qty){
    const book = state.books.find(b=>b.id===id);
    qty = Math.max(0, Math.min(qty, book?availableStock(book):qty));
    const next = {...state.cart};
    if(qty<=0){ delete next[id]; } else { next[id]=qty; }
    setState({cart:next});
  }
  function removeFromCart(id){
    const next = {...state.cart}; delete next[id]; setState({cart:next});
  }

  // A book can have several photos (book.images, an array) — older records
  // may only have the single legacy book.image field, so fall back to that.
  function bookImages(book){
    if(Array.isArray(book.images) && book.images.filter(Boolean).length) return book.images.filter(Boolean);
    return book.image ? [book.image] : [];
  }

  // ---------- book detail + photo lightbox ----------
  function openBookDetail(id){ setState({viewingBookId:id, viewingImageIndex:0}); }
  function closeBookDetail(){ setState({viewingBookId:null}); }
  function openLightbox(src, title){ if(src) setState({lightbox:{src, title}}); }
  function closeLightbox(){ setState({lightbox:null}); }

  // ---------- checkout ----------
  function loadReceipts(){ return readLocal('.receipts', []); }
  function saveReceiptsLocal(receipts){ return writeLocal('.receipts', receipts); }

  function placeOrder(buyer){
    const items = cartItems();
    if(items.length===0) return;
    const order = {
      id:'ORD-'+Date.now().toString(36).toUpperCase(),
      buyerName:buyer.name,
      contact:buyer.contact,
      address:buyer.address,
      paymentMode:buyer.paymentMode,
      items:items.map(i=>({id:i.id, title:i.title, price:i.price, qty:i.qty})),
      total:cartTotal(),
      status:'Pending',
      createdAt:new Date().toISOString(),
      proofOfPayment: buyer.proofOfPayment || null
    };
    // decrement stock on the SHARED book records (same ones inventory.html reads)
    const books = state.books.map(b=>{
      const item = items.find(i=>i.id===b.id);
      return item ? {...b, stock:Math.max(0,(Number(b.stock)||0)-item.qty)} : b;
    });
    const orders = [order, ...state.orders];

    // Also record this as a Receipt — same shape/key Admin > Receipts uses
    // for manually-recorded sales — so every shop checkout shows up there
    // too, with the same invoice-style view/print/download buyers and the
    // seller both see. It's linked to the order by sharing the same id.
    const receipt = {
      id: order.id,
      date: order.createdAt,
      customer: order.buyerName,
      address: order.address || '',
      phone: order.contact,
      paymentMethod: order.paymentMode,
      saleIds: [],
      items: items.map(i => ({
        title: i.title,
        author: i.author || '',
        genre: i.genre || 'General',
        type: i.type || 'Paperback',
        condition: i.condition || 'Pre Loved',
        box: i.box || '',
        qty: i.qty,
        unitPrice: i.price,
        discount: 0,
        stockAfter: null
      })),
      total: order.total,
      shipped: false,
      paid: false,
      refunded: false,
      shopOrder: true,
      proofOfPayment: order.proofOfPayment || null
    };
    const receipts = [receipt, ...loadReceipts()];

    const catalogOk  = saveCatalog(books);
    const ordersOk   = saveOrders(orders);
    const receiptsOk = saveReceiptsLocal(receipts);
    if(!catalogOk || !ordersOk || !receiptsOk) return;
    setState({books, orders, cart:{}, checkoutOpen:false, lastOrder:order, view:'confirm'});
  }

  // ---------- render helpers ----------
  function el(tag, attrs, children){
    const e = document.createElement(tag);
    attrs = attrs||{};
    for(const k in attrs){
      if(k==='class') e.className=attrs[k];
      else if(k==='html') e.innerHTML=attrs[k];
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }

  // ---------- Promo banner carousel ----------
  // Self-contained: manages its own rotation with a local interval instead
  // of going through setState, so it doesn't trigger a full app re-render
  // (and lose search focus, etc.) every few seconds.
  const BANNERS = [
    {emoji:'💳', title:'Payment First, Always', text:'Orders are confirmed and shipped only once payment is verified — simple and safe.', tone:'spine'},
    {emoji:'📚', title:'Pre-Loved Books, Priceless Stories', text:'Every copy here has already been someone\u2019s favorite — ready to become yours.', tone:'brick'},
    {emoji:'🕊️', title:'No Rush Shipping', text:'No pressure, no rush — we pack every order with care and get it to you steadily.', tone:'brass'},
    {emoji:'✨', title:'Fresh Finds, Often', text:'New titles are added to the shelf regularly — check back for brand new arrivals.', tone:'spine-light'}
  ];
  function bannerCarousel(){
    const wrap = el('div',{class:'banner-carousel'});
    const track = el('div',{class:'banner-track'});
    BANNERS.forEach(b=>{
      track.appendChild(el('div',{class:'banner-slide tone-'+b.tone},[
        el('div',{class:'banner-emoji'},[b.emoji]),
        el('div',{class:'banner-text'},[
          el('div',{class:'banner-title'},[b.title]),
          el('div',{class:'banner-sub'},[b.text])
        ])
      ]));
    });
    wrap.appendChild(track);

    const dots = el('div',{class:'banner-dots'});
    let idx = 0;
    const dotEls = BANNERS.map((_,i)=>{
      const d = el('span',{class:'banner-dot'+(i===0?' active':''), onclick:()=>goTo(i)});
      dots.appendChild(d);
      return d;
    });
    wrap.appendChild(dots);

    function goTo(i){
      idx = ((i % BANNERS.length) + BANNERS.length) % BANNERS.length;
      track.style.transform = 'translateX(-'+(idx*100)+'%)';
      dotEls.forEach((d,j)=>d.classList.toggle('active', j===idx));
    }
    const timer = setInterval(()=>goTo(idx+1), 4800);
    // The whole app tree gets rebuilt on every setState elsewhere, which
    // detaches this exact node — clean up the interval once that happens
    // so we don't pile up timers in the background.
    const stopWatch = setInterval(()=>{
      if(!document.body.contains(wrap)){ clearInterval(timer); clearInterval(stopWatch); }
    }, 3000);

    return wrap;
  }

    const card = el('div',{class:'card'});

    const cov = coverEl(book,'cover', ()=>openBookDetail(book.id));
    cov.appendChild(el('div',{class:'stock-flag'+(out?' out':'')},[out?'OUT':avail+' LEFT']));
    card.appendChild(cov);
    const body = el('div',{class:'card-body'});
    if(isPromo(book)) body.appendChild(el('div',{class:'promo-pill'},['🔥 On Promo']));
    body.appendChild(el('div',{class:'price'},[peso(book.price)]));
    body.appendChild(el('div',{class:'title', style:'cursor:pointer;', onclick:()=>openBookDetail(book.id)},[book.title]));
    body.appendChild(el('div',{class:'meta'},[[book.genre,book.type].filter(Boolean).join(' · ')]));
    body.appendChild(el('div',{class:'meta'},[book.condition||'']));
    const actions = el('div',{class:'card-actions'});
    const detailsBtn = el('button',{class:'btn btn-outline', onclick:()=>openBookDetail(book.id)},['Details']);
    const addBtn = el('button',{class:'btn btn-primary', onclick:()=>addToCart(book.id)},['Add to cart']);
    if(out) addBtn.disabled = true;
    actions.appendChild(detailsBtn);

    body.appendChild(actions);
    card.appendChild(body);
    return card;

      const shopVisible = state.books.filter(b=>b.shopVisible);

      const brandNewBooks = shopVisible.filter(isBrandNew);
      const promoShelf = shelfSection('🔥', 'On Promo', 'Limited-time', promoBooks);

      const newShelf = shelfSection('✨', 'Brand New Arrivals', null, brandNewBooks);
      if(newShelf) wrap.appendChild(newShelf);
    }
    const books = state.books.filter(b =>
      b.shopVisible
      && (!q || (b.title||'').toLowerCase().includes(q) || (b.author||'').toLowerCase().includes(q))
      && (!state.genreFilter || (b.genre||'General')===state.genreFilter)
    );

        el('h3',{},['The shelf is empty right now']),

      ]));

      wrap.appendChild(el('div',{class:'empty'},[el('h3',{},['No books found']), el('p',{},['Try a different search term, or check back when more books are added to the shop.'])]));
    }else{
      const byGenre = new Map();
      books.forEach(b=>{
        const g = b.genre || 'General';
        if(!byGenre.has(g)) byGenre.set(g, []);
        byGenre.get(g).push(b);
      });
      const genres = Array.from(byGenre.keys()).sort((a,b)=>a.localeCompare(b));

        section.appendChild(el('div',{class:'genre-heading'},[
          el('h2',{},[g]),

        ]));
        const grid = el('div',{class:'grid'});
        byGenre.get(g).forEach(b=>grid.appendChild(bookCard(b)));
        section.appendChild(grid);
        wrap.appendChild(section);
      });
    }
    return wrap;
  }

          ${gcashContent}
        </div>
        <div>
          <div class="title" style="font-size:16px;">Bank Transfer</div>
          <div class="meta">Bank details are shared after checkout. Please screenshot your receipt and keep it until your order ships.</div>
        </div>
        <div class="meta" style="border-top:1px solid var(--line); padding-top:14px;">
          Orders are held for 48 hours pending payment. Unpaid orders past that window may be released back into stock.
        </div>
      </div>`;
    wrap.appendChild(panel);
    const qrImg = panel.querySelector('#bn-gcash-qr-img');
    if(qrImg) qrImg.addEventListener('click', ()=>openLightbox(qrSrc, 'GCash QR Code'));
    return wrap;
  }

  // ---------- main render ----------
  function render(){
    const root = document.getElementById('root');
    root.innerHTML = '';
    const app = el('div',{class:'app'});

    const spine = el('div',{class:'spine'});
    spine.appendChild(el('div',{class:'brand'},[
      el('div',{class:'brand-mark'},['BookNest']),
      el('div',{class:'brand-sub'},['PRE-LOVED BOOKS'])
    ]));
    spine.appendChild(navItem('shop','Shop'));
    spine.appendChild(navItem('cart','Cart', cartCount()||null));
    spine.appendChild(navItem('payment','Payment info'));

    spine.appendChild(el('div',{class:'spine-footer'},['© '+new Date().getFullYear()+' BookNest']));
    app.appendChild(spine);

    const main = el('div',{class:'main'});
    if(state.view==='shop') main.appendChild(shopView());
    else if(state.view==='cart') main.appendChild(cartView());
    else if(state.view==='confirm') main.appendChild(confirmView());
    else if(state.view==='payment') main.appendChild(paymentInfoView());
    app.appendChild(main);

    root.appendChild(app);

    const modal = checkoutModal();
    if(modal) root.appendChild(modal);

    const bookModal = bookDetailModal();
    if(bookModal) root.appendChild(bookModal);

    const lb = lightboxOverlay();
    if(lb) root.appendChild(lb);

    if(state.toast){
      const t = el('div',{style:'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--white); padding:10px 18px; border-radius:4px; font-size:13.5px; z-index:100;'},[state.toast]);
      root.appendChild(t);
    }
  }

  render();
})();
</script>
</body>
</html>
