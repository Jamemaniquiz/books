<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookNest — Pre-loved Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE7D8;
    --paper-light:#F8F3E7;
    --ink:#26211A;
    --ink-soft:#5B5344;
    --spine:#35493C;
    --spine-dark:#263329;
    --spine-light:#4A6151;
    --brick:#A8402A;
    --brick-dark:#8A3220;
    --brass:#9C7A34;
    --line:#D9CDB2;
    --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.serif{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* SPINE NAV */
  .spine{
    width:180px;
    flex-shrink:0;
    background:var(--spine);
    color:var(--white);
    display:flex;
    flex-direction:column;
    padding:28px 0;
    position:relative;
  }
  .spine::after{
    content:"";
    position:absolute;
    right:0;top:0;bottom:0;
    width:6px;
    background:linear-gradient(90deg, rgba(0,0,0,0.18), transparent);
  }
  .brand{
    padding:0 22px 24px 22px;
    border-bottom:1px solid rgba(255,255,255,0.14);
    margin-bottom:18px;
  }
  .brand-mark{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:26px;
    line-height:1.1;
    color:var(--white);
  }
  .brand-sub{
    font-size:11px;
    letter-spacing:0.04em;
    color:rgba(255,255,255,0.55);
    margin-top:6px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 22px;
    color:rgba(255,255,255,0.72);
    cursor:pointer;
    font-size:14.5px;
    border-left:3px solid transparent;
    transition:background 0.15s, color 0.15s;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:var(--white); }
  .nav-item.active{
    background:rgba(255,255,255,0.09);
    color:var(--white);
    border-left:3px solid var(--brick);
  }
  .nav-badge{
    margin-left:auto;
    background:var(--brick);
    color:var(--white);
    font-size:11px;
    padding:1px 7px;
    border-radius:9px;
    min-width:18px;
    text-align:center;
  }
  .spine-footer{
    margin-top:auto;
    padding:14px 22px 0 22px;
    font-size:11.5px;
    color:rgba(255,255,255,0.4);
    border-top:1px solid rgba(255,255,255,0.1);
    padding-top:14px;
  }

  /* MAIN */
  .main{ flex:1; padding:36px 44px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .page-head h1{ font-size:30px; margin:0; }
  .page-head p{ margin:4px 0 0 0; color:var(--ink-soft); font-size:14.5px; }

  .toolbar{ display:flex; gap:10px; align-items:center; }
  input[type=text], input[type=number], input[type=tel], input[type=password], select, textarea{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 12px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    border-radius:3px;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--spine-light); outline-offset:1px; }

  .btn{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:9px 16px;
    border-radius:3px;
    border:1px solid transparent;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary{ background:var(--brick); color:var(--white); }
  .btn-primary:hover{ background:var(--brick-dark); }
  .btn-primary:disabled{ background:#C7BBA5; cursor:not-allowed; }
  .btn-outline{ background:transparent; border-color:var(--ink); color:var(--ink); }
  .btn-outline:hover{ background:var(--ink); color:var(--white); }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
  .btn-ghost:hover{ border-color:var(--ink); color:var(--ink); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }
  .btn-danger{ background:transparent; color:var(--brick); border-color:var(--brick); }
  .btn-danger:hover{ background:var(--brick); color:var(--white); }

  .notice{
    background:#F4E4DD;
    border:1px solid #E2B7A6;
    color:var(--brick-dark);
    padding:16px 20px;
    border-radius:3px;
    font-size:13.5px;
    line-height:1.6;
    margin-bottom:24px;
  }
  .notice b{ display:block; font-size:12px; letter-spacing:0.06em; margin-bottom:4px; }

  /* GRID */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:28px 24px;
  }
  .card{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:4px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 1px 2px rgba(38,33,26,0.04);
    transition:transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 14px 28px rgba(38,33,26,0.16);
    border-color:var(--brass);
  }
  .shelf-tab{
    position:absolute;
    top:12px; left:0;
    background:var(--spine);
    color:var(--white);
    font-size:10.5px;
    letter-spacing:0.03em;
    padding:3px 9px 3px 8px;
    border-radius:0 3px 3px 0;
    z-index:2;
  }
  .cover{
    aspect-ratio:3/4;
    background:linear-gradient(160deg, var(--spine-light), var(--spine-dark));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    position:relative;
    overflow:hidden;
  }
  .cover img{
    width:100%; height:100%; object-fit:cover;
    transition:transform 0.25s ease;
  }
  .card:hover .cover img{ transform:scale(1.04); }
  .cover-fallback{
    text-align:center;
    color:rgba(255,255,255,0.92);
  padding:20px;
  }
  .cover-fallback .t{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; line-height:1.25; }
  .cover-fallback .a{ font-size:10.5px; margin-top:8px; color:rgba(255,255,255,0.6); letter-spacing:0.03em; text-transform:uppercase; }
  .stock-flag{
    position:absolute; top:10px; right:10px;
    background:var(--brass); color:var(--white);
    font-size:10px; font-weight:700; letter-spacing:0.03em;
    padding:3px 7px; border-radius:2px;
  }
  .stock-flag.out{ background:#8a8a8a; }
  .card-body{ padding:14px 15px 15px 15px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .price{ color:var(--brick); font-weight:700; font-size:14.5px; }
  .title{ font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; line-height:1.25; margin:1px 0 2px 0; }
  .meta{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .card-actions{ margin-top:10px; display:flex; gap:8px; }
  .card-actions .btn{ flex:1; justify-content:center; }

  .empty{ padding:60px 20px; text-align:center; color:var(--ink-soft); }
  .empty h3{ margin-bottom:8px; }

  /* CART / TABLE */
  .cart-row{
    display:grid;
    grid-template-columns:64px 1fr 110px 90px 90px 32px;
    gap:14px;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-row .mini-cover{ width:48px; height:64px; border-radius:2px; background:linear-gradient(160deg, var(--spine-light), var(--spine-dark)); }
  .cart-row .mini-cover img{ width:100%; height:100%; object-fit:cover; border-radius:2px; }
  .qty-input{ width:56px; text-align:center; }
  .cart-total-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 0 0 0; margin-top:6px;
  }
  .cart-total-bar .sum{ font-family:'Fraunces',serif; font-size:22px; }

  .panel{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:3px;
    padding:24px;
  }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-grid.full{ grid-template-columns:1fr; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-span2{ grid-column:1/-1; }

  table.admin-table{ width:100%; border-collapse:collapse; }
  table.admin-table th{ text-align:left; font-size:11.5px; letter-spacing:0.04em; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line); }
  table.admin-table td{ padding:10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  table.admin-table tr:hover td{ background:rgba(53,73,60,0.04); }

  .order-card{ border:1px solid var(--line); border-radius:3px; margin-bottom:14px; background:var(--paper-light); overflow:hidden; }
  .order-head{ display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background:rgba(53,73,60,0.05); border-bottom:1px solid var(--line); flex-wrap:wrap; gap:8px; }
  .order-id{ font-family:'Fraunces',serif; font-weight:600; }
  .status-pill{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:10px; letter-spacing:0.02em; }
  .status-Pending{ background:#F1DCC4; color:#8A5A1F; }
  .status-Paid{ background:#D8E6D9; color:#2E5A34; }
  .status-Shipped{ background:#D6E1EC; color:#2A4A6B; }
  .status-Cancelled{ background:#E9D6D6; color:#8A2E2E; }
  .order-body{ padding:14px 18px; font-size:13.5px; }
  .order-body .line{ display:flex; justify-content:space-between; padding:3px 0; color:var(--ink-soft); }
  .order-actions{ padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(38,33,26,0.55);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--paper-light); border-radius:4px; max-width:480px; width:100%;
    padding:28px; max-height:88vh; overflow-y:auto;
  }
  .modal h2{ margin-top:0; font-size:22px; }
  .modal-close{ float:right; cursor:pointer; font-size:20px; color:var(--ink-soft); line-height:1; background:none;border:none; }

  .photo-count-badge{
    position:absolute; bottom:8px; left:8px;
    background:rgba(38,33,26,0.7); color:var(--white);
    font-size:10px; font-weight:700; padding:3px 7px; border-radius:2px;
  }

  /* Book detail modal */
  .book-detail-main-img{
    width:100%; max-height:320px; object-fit:cover; border-radius:4px;
    cursor:zoom-in; display:block;
  }
  .book-detail-noimg{
    height:160px; border-radius:4px; background:linear-gradient(160deg, var(--spine-light), var(--spine-dark));
    color:rgba(255,255,255,0.85); display:flex; align-items:center; justify-content:center; font-size:14px;
  }
  .book-detail-thumbs{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .book-detail-thumb{
    width:52px; height:68px; object-fit:cover; border-radius:2px; cursor:pointer;
    border:2px solid transparent; opacity:0.7;
  }
  .book-detail-thumb:hover{ opacity:1; }
  .book-detail-thumb.active{ border-color:var(--brick); opacity:1; }
  .book-detail-tags{ display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .book-detail-tags .tag{
    background:rgba(53,73,60,0.08); color:var(--spine-dark);
    font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:10px;
  }
  .book-detail-desc{
    margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
    font-size:13.5px; line-height:1.65; color:var(--ink); white-space:pre-wrap;
  }

  /* Lightbox (click any photo to enlarge) */
  .lightbox-backdrop{
    position:fixed; inset:0; background:rgba(15,13,10,0.85);
    display:flex; align-items:center; justify-content:center; z-index:80; padding:24px;
    cursor:zoom-out;
  }
  .lightbox-box{ max-width:min(680px, 92vw); max-height:90vh; text-align:center; cursor:default; position:relative; }
  .lightbox-img{ max-width:100%; max-height:80vh; border-radius:4px; display:block; margin:0 auto; }
  .lightbox-caption{ color:var(--white); font-size:13px; margin-top:10px; }
  .lightbox-close{
    position:absolute; top:-14px; right:-14px; width:32px; height:32px; border-radius:50%;
    background:var(--white); color:var(--ink); border:none; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .lock-screen{ max-width:340px; margin:60px auto; text-align:center; }
  .lock-screen .field{ margin:16px 0; text-align:left; }

  .pay-method{
    border:1px solid var(--line); border-radius:3px; padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; gap:10px; cursor:pointer;
  }
  .pay-method.selected{ border-color:var(--spine); background:rgba(53,73,60,0.06); }

  .confirm-box{ text-align:center; padding:20px 0; }
  .confirm-box .big{ font-family:'Fraunces',serif; font-size:20px; margin:10px 0 4px 0; }

  ::placeholder{ color:#B3A98F; }

  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .spine{ width:100%; flex-direction:row; overflow-x:auto; padding:10px 0; }
    .brand{ display:none; }
    .nav-item{ padding:10px 16px; white-space:nowrap; border-left:none; border-bottom:3px solid transparent; }
    .nav-item.active{ border-left:none; border-bottom:3px solid var(--brick); }
    .spine-footer{ display:none; }
    .main{ padding:22px 18px; }
    .cart-row{ grid-template-columns:48px 1fr; grid-template-areas:"cover title" "cover meta" "cover controls"; row-gap:4px; }
    .form-grid{ grid-template-columns:1fr; }
  }

  @media (max-width: 600px) {
    .modal {
      max-width: 100vw;
      width: 100%;
      max-height: 90vh;
      padding: 20px;
      border-radius: 12px 12px 0 0;
      margin: 0 auto auto auto;
    }

    .modal-backdrop {
      padding: 0;
      align-items: flex-end;
      background: rgba(38, 33, 26, 0.6);
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .modal-close {
      float: right;
      font-size: 24px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }

    .field input[type="text"],
    .field input[type="tel"],
    .field textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: inherit;
    }

    #ck-proof-preview {
      height: 100px;
      border-radius: 6px;
      padding: 10px;
    }

    #ck-proof-preview img {
      border-radius: 6px;
    }

    .btn {
      padding: 12px 16px;
      font-size: 15px;
      width: 100%;
    }

    .btn.btn-primary {
      margin-top: 12px;
    }

    .meta {
      font-size: 12px;
      line-height: 1.5;
    }

    .cart-row {
      grid-template-columns: 40px 1fr 40px;
      gap: 10px;
      padding: 12px 0;
    }

    .cart-row .mini-cover {
      width: 40px;
      height: 54px;
    }

    .qty-input {
      width: 45px;
      padding: 6px 4px;
      font-size: 13px;
    }

    .cart-total-bar {
      font-size: 14px;
      padding: 12px 0 0 0;
    }

    .cart-total-bar .sum {
      font-size: 18px;
    }

    .panel {
      padding: 16px;
      border-radius: 8px;
    }

    .confirm-box {
      padding: 16px 0;
    }

    .confirm-box .big {
      font-size: 18px;
    }
  }

  @media (max-width: 380px) {
    .modal {
      padding: 16px;
    }

    .modal h2 {
      font-size: 16px;
    }

    .field input[type="text"],
    .field input[type="tel"],
    .field textarea {
      padding: 8px 10px;
      font-size: 14px;
    }

    #ck-proof-preview {
      height: 80px;
      font-size: 11px;
    }

    .btn {
      padding: 10px 12px;
      font-size: 13px;
    }

    .meta {
      font-size: 11px;
    }

    .cart-row {
      grid-template-columns: 35px 1fr 35px;
      gap: 8px;
      padding: 10px 0;
    }

    .cart-row .mini-cover {
      width: 35px;
      height: 47px;
    }

    .panel {
      padding: 12px;
    }
  }

</style>
</head>
<body>

<div id="root"></div>

<script src="app.js"></script>
<script>
(function(){

  // ---------- storage: shared with the seller admin app ----------
  // This page reads the SAME book records the seller manages in
  // inventory.html (same localStorage key, same browser/device). No
  // separate catalog, no login for buyers — orders are written to their
  // own key so the seller can review them from the password-protected
  // Admin > Orders page.
  const BOOKS_KEY  = '.books';
  const ORDERS_KEY = '.shop_orders';

  function readLocal(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function writeLocal(key, value){
    try{
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    }catch(e){
      console.error('[BookNest shop] save failed for', key, e);
      showToast('Could not save — your browser storage may be full.');
      return false;
    }
  }

  function loadCatalog(){ return readLocal(BOOKS_KEY, []); }
  function saveCatalog(books){ return writeLocal(BOOKS_KEY, books); }
  function loadOrders(){ return readLocal(ORDERS_KEY, []); }
  function saveOrders(orders){ return writeLocal(ORDERS_KEY, orders); }

  // A book is available to buy if it has stock left beyond anything the
  // seller has already put on layaway (mirrors the admin app's own rule).
  function availableStock(book){
    const holds = Array.isArray(book.layawayHolds) ? book.layawayHolds : [];
    return Math.max(0, (Number(book.stock)||0) - holds.length);
  }

  const uid = (p) => p + Math.random().toString(36).slice(2,9);
  const peso = (n) => 'PHP ' + Number(n).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});

  // ---------- layaway ----------
  // Only orders of PHP 1,000 and up may be paid on layaway. Buyers choose a
  // duration; the fee for that duration is added on top of the books' price.
  const LAYAWAY_MIN = 1000;
  const LAYAWAY_PLANS = [
    { months:1, fee:100 },
    { months:2, fee:200 },
    { months:3, fee:300 }
  ];

  // Splits (subtotal + fee) into `months` payments: the first is due today,
  // each following one is due on the 15th of the next calendar month. The
  // amount is split evenly, with any rounding remainder folded into the
  // last payment so the total always adds up exactly.
  function buildLayawaySchedule(subtotal, months){
    const plan = LAYAWAY_PLANS.find(p=>p.months===months) || LAYAWAY_PLANS[0];
    const total = subtotal + plan.fee;
    const base = Math.floor(total / months);
    const today = new Date();
    const payments = [];
    for(let i=0;i<months;i++){
      const amount = (i===months-1) ? (total - base*(months-1)) : base;
      const due = i===0 ? new Date(today) : new Date(today.getFullYear(), today.getMonth()+i, 15);
      payments.push({
        amount,
        dueDate: due.toISOString(),
        label: i===0 ? 'Due now' : ('Due '+due.toLocaleDateString('en-PH',{month:'short', day:'numeric', year:'numeric'}))
      });
    }
    return { months, fee:plan.fee, subtotal, total, payments };
  }

  // ---------- state ----------
  let state = {
    view: 'shop',
    books: loadCatalog(),
    orders: loadOrders(),
    cart:{}, // id -> qty  (in-memory only, resets on reload)
    search:'',
    checkoutOpen:false,
    checkoutMode:'full',   // 'full' = pay in full, 'layaway' = installment plan
    layawayMonths:1,       // duration the buyer has picked in the cart, 1-3
    lastOrder:null,
    trackId:'',
    trackedOrder:undefined, // undefined = not searched yet, null = not found
    toast:null,
    viewingBookId:null,   // book detail modal (multiple photos + full details)
    viewingImageIndex:0,  // which photo is showing large inside that modal
    lightbox:null         // {src, title} — fullscreen photo viewer, used by both
                           // the book detail modal and the Payment info QR code
  };

  function setState(patch){ state = {...state, ...patch}; render(); }

  function showToast(msg){
    setState({toast:msg});
    setTimeout(()=>{ if(state.toast===msg) setState({toast:null}); }, 2600);
  }

  // Refresh the catalog from storage each time we come back to the shop
  // view, so stock the seller just changed in Inventory shows up here too.
  function refreshCatalog(){
    setState({books: loadCatalog()});
  }

  // ---------- cart logic ----------
  function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
  function cartItems(){
    return Object.entries(state.cart).map(([id,qty])=>{
      const book = state.books.find(b=>b.id===id);
      return book ? {...book, qty} : null;
    }).filter(Boolean);
  }
  function cartTotal(){ return cartItems().reduce((sum,i)=>sum+i.price*i.qty,0); }

  function addToCart(id){
    const book = state.books.find(b=>b.id===id);
    if(!book) return;
    const current = state.cart[id]||0;
    if(current >= availableStock(book)){ showToast('No more stock available'); return; }
    setState({cart:{...state.cart, [id]:current+1}});
    showToast('Added to cart');
  }
  function setCartQty(id, qty){
    const book = state.books.find(b=>b.id===id);
    qty = Math.max(0, Math.min(qty, book?availableStock(book):qty));
    const next = {...state.cart};
    if(qty<=0){ delete next[id]; } else { next[id]=qty; }
    setState({cart:next});
  }
  function removeFromCart(id){
    const next = {...state.cart}; delete next[id]; setState({cart:next});
  }

  // A book can have several photos (book.images, an array) — older records
  // may only have the single legacy book.image field, so fall back to that.
  function bookImages(book){
    if(Array.isArray(book.images) && book.images.filter(Boolean).length) return book.images.filter(Boolean);
    return book.image ? [book.image] : [];
  }

  // ---------- book detail + photo lightbox ----------
  function openBookDetail(id){ setState({viewingBookId:id, viewingImageIndex:0}); }
  function closeBookDetail(){ setState({viewingBookId:null}); }
  function openLightbox(src, title){ if(src) setState({lightbox:{src, title}}); }
  function closeLightbox(){ setState({lightbox:null}); }

  // ---------- checkout ----------
  function loadReceipts(){ return readLocal('.receipts', []); }
  function saveReceiptsLocal(receipts){ return writeLocal('.receipts', receipts); }

  function placeOrder(buyer){
    const items = cartItems();
    if(items.length===0) return;
    const plan = buyer.layawayPlan || null;
    const order = {
      id:'ORD-'+Date.now().toString(36).toUpperCase(),
      buyerName:buyer.name,
      contact:buyer.contact,
      address:buyer.address,
      paymentMode:buyer.paymentMode,
      items:items.map(i=>({id:i.id, title:i.title, price:i.price, qty:i.qty})),
      total: plan ? plan.total : cartTotal(),
      amountDueNow: plan ? plan.payments[0].amount : cartTotal(),
      layawayPlan: plan,
      status:'Pending',
      createdAt:new Date().toISOString(),
      proofOfPayment: buyer.proofOfPayment || null
    };
    // decrement stock on the SHARED book records (same ones inventory.html reads)
    const books = state.books.map(b=>{
      const item = items.find(i=>i.id===b.id);
      return item ? {...b, stock:Math.max(0,(Number(b.stock)||0)-item.qty)} : b;
    });
    const orders = [order, ...state.orders];

    // Also record this as a Receipt — same shape/key Admin > Receipts uses
    // for manually-recorded sales — so every shop checkout shows up there
    // too, with the same invoice-style view/print/download buyers and the
    // seller both see. It's linked to the order by sharing the same id.
    const receipt = {
      id: order.id,
      date: order.createdAt,
      customer: order.buyerName,
      address: order.address || '',
      phone: order.contact,
      paymentMethod: order.paymentMode,
      saleIds: [],
      items: items.map(i => ({
        title: i.title,
        author: i.author || '',
        genre: i.genre || 'General',
        type: i.type || 'Paperback',
        condition: i.condition || 'Pre Loved',
        box: i.box || '',
        qty: i.qty,
        unitPrice: i.price,
        discount: 0,
        stockAfter: null
      })),
      total: order.total,
      amountDueNow: order.amountDueNow,
      layawayPlan: order.layawayPlan,
      shipped: false,
      paid: false,
      refunded: false,
      shopOrder: true,
      proofOfPayment: order.proofOfPayment || null
    };
    const receipts = [receipt, ...loadReceipts()];

    const catalogOk  = saveCatalog(books);
    const ordersOk   = saveOrders(orders);
    const receiptsOk = saveReceiptsLocal(receipts);
    if(!catalogOk || !ordersOk || !receiptsOk) return;
    setState({books, orders, cart:{}, checkoutOpen:false, lastOrder:order, view:'confirm'});
  }

  // ---------- render helpers ----------
  function el(tag, attrs, children){
    const e = document.createElement(tag);
    attrs = attrs||{};
    for(const k in attrs){
      if(k==='class') e.className=attrs[k];
      else if(k==='html') e.innerHTML=attrs[k];
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }

  function navItem(key, label, badge){
    const active = state.view===key || (state.view==='confirm' && key==='shop');
    const item = el('div',{class:'nav-item'+(active?' active':''), onclick:()=>{
      if(key==='shop') refreshCatalog();
      setState({view:key});
    }},[label]);
    if(badge) item.appendChild(el('span',{class:'nav-badge'},[String(badge)]));
    return item;
  }

  function coverEl(book, sizeClass, onClick){
    const images = bookImages(book);
    const attrs = {class:sizeClass||'cover'};
    if(onClick){ attrs.onclick = onClick; attrs.style = 'cursor:zoom-in;'; attrs.title = 'Tap to see more photos & details'; }
    const c = el('div',attrs);
    if(images.length){
      c.appendChild(el('img',{src:images[0], alt:book.title}));
      if(images.length>1) c.appendChild(el('div',{class:'photo-count-badge'},['📷 '+images.length]));
    }else{
      c.appendChild(el('div',{class:'cover-fallback'},[
        el('div',{class:'t'},[book.title]),
        el('div',{class:'a'},[book.author||''])
      ]));
    }
    return c;
  }

  function bookCard(book){
    const avail = availableStock(book);
    const out = avail<=0;
    const card = el('div',{class:'card'});
    if(book.box) card.appendChild(el('div',{class:'shelf-tab'},['📦 '+book.box]));
    const cov = coverEl(book,'cover', ()=>openBookDetail(book.id));
    cov.appendChild(el('div',{class:'stock-flag'+(out?' out':'')},[out?'OUT':avail+' LEFT']));
    card.appendChild(cov);
    const body = el('div',{class:'card-body'});
    body.appendChild(el('div',{class:'price'},[peso(book.price)]));
    body.appendChild(el('div',{class:'title', style:'cursor:pointer;', onclick:()=>openBookDetail(book.id)},[book.title]));
    body.appendChild(el('div',{class:'meta'},[[book.genre,book.type].filter(Boolean).join(' · ')]));
    body.appendChild(el('div',{class:'meta'},[book.condition||'']));
    const actions = el('div',{class:'card-actions'});
    const detailsBtn = el('button',{class:'btn btn-outline', onclick:()=>openBookDetail(book.id)},['Details']);
    const addBtn = el('button',{class:'btn btn-primary', onclick:()=>addToCart(book.id)},['Add to cart']);
    if(out) addBtn.disabled = true;
    actions.appendChild(detailsBtn);
    actions.appendChild(addBtn);
    body.appendChild(actions);
    card.appendChild(body);
    return card;
  }

  // Full book detail — every photo (click one to see it fullscreen) plus
  // every detail the seller has entered, including their description.
  function bookDetailModal(){
    if(!state.viewingBookId) return null;
    const book = state.books.find(b=>b.id===state.viewingBookId);
    if(!book) return null;
    const images = bookImages(book);
    const idx = images.length ? Math.min(state.viewingImageIndex||0, images.length-1) : 0;
    const avail = availableStock(book);
    const out = avail<=0;

    const backdrop = el('div',{class:'modal-backdrop', onclick:(e)=>{ if(e.target===backdrop) closeBookDetail(); }});
    const modal = el('div',{class:'modal', style:'max-width:520px;'});
    modal.appendChild(el('button',{class:'modal-close', onclick:closeBookDetail},['×']));

    if(images.length){
      modal.appendChild(el('img',{
        src:images[idx], alt:book.title, class:'book-detail-main-img', title:'Tap to enlarge',
        onclick:()=>openLightbox(images[idx], book.title)
      }));
      if(images.length>1){
        const thumbs = el('div',{class:'book-detail-thumbs'});
        images.forEach((src,i)=>{
          thumbs.appendChild(el('img',{
            src, class:'book-detail-thumb'+(i===idx?' active':''),
            onclick:()=>setState({viewingImageIndex:i})
          }));
        });
        modal.appendChild(thumbs);
      }
    }else{
      modal.appendChild(el('div',{class:'book-detail-noimg'},['📕 No photo uploaded yet']));
    }

    modal.appendChild(el('h2',{},[book.title]));
    modal.appendChild(el('p',{class:'meta'},[book.author ? 'by '+book.author : 'Author unknown']));

    const tags = el('div',{class:'book-detail-tags'});
    [book.genre||'General', book.type||'Paperback', book.condition||'Pre Loved'].forEach(t=>{
      tags.appendChild(el('span',{class:'tag'},[t]));
    });
    modal.appendChild(tags);

    modal.appendChild(el('div',{class:'price', style:'font-size:20px;margin-top:10px;'},[peso(book.price)]));
    modal.appendChild(el('p',{class:'meta'},[out ? 'Out of stock' : avail+' left in stock']));

    modal.appendChild(el('div',{class:'book-detail-desc'},[
      book.description && book.description.trim() ? book.description.trim() : 'No description from the seller yet.'
    ]));

    const addBtn = el('button',{
      class:'btn btn-primary', style:'width:100%;justify-content:center;margin-top:16px;padding:12px;',
      onclick:()=>addToCart(book.id)
    },[out?'Out of stock':'Add to cart']);
    if(out) addBtn.disabled = true;
    modal.appendChild(addBtn);

    backdrop.appendChild(modal);
    return backdrop;
  }

  // Fullscreen photo viewer — reused for book photos and the GCash QR code.
  function lightboxOverlay(){
    if(!state.lightbox) return null;
    const backdrop = el('div',{class:'lightbox-backdrop', onclick:closeLightbox});
    const box = el('div',{class:'lightbox-box', onclick:(e)=>e.stopPropagation()});
    box.appendChild(el('button',{class:'lightbox-close', onclick:closeLightbox},['×']));
    box.appendChild(el('img',{src:state.lightbox.src, alt:state.lightbox.title||'', class:'lightbox-img'}));
    if(state.lightbox.title) box.appendChild(el('div',{class:'lightbox-caption'},[state.lightbox.title]));

  function shopView(){
    const wrap = el('div');
    wrap.appendChild(el('div',{class:'page-head'},[
      el('div',{},[
        el('h1',{},['All books']),
        el('p',{},['Browse what\'s currently on the shelf. Stock updates as the seller adds or sells books.'])
      ]),
      (function(){
        const tb = el('div',{class:'toolbar'});
        const input = el('input',{type:'text', placeholder:'Search title or author...', value:state.search});
        input.addEventListener('input', e=>setState({search:e.target.value}));
        tb.appendChild(input);
        return tb;
      })()
    ]));
    wrap.appendChild(el('div',{class:'notice'},[
      el('b',{},['NOTICE']),
      'Estimated ship-out is 2 weeks from date of payment confirmation. Pricing errors will be corrected before an order is confirmed — we\'ll always check with you first.'
    ]));
    const q = state.search.trim().toLowerCase();
    const books = state.books.filter(b => b.shopVisible && (!q || (b.title||'').toLowerCase().includes(q) || (b.author||'').toLowerCase().includes(q)));
    if(state.books.length===0){
      wrap.appendChild(el('div',{class:'empty'},[
        el('h3',{},['The shelf is empty right now']),
        el('p',{},['The seller hasn\'t added any books to the shop yet — check back soon.'])
      ]));
    }else if(books.length===0){
      wrap.appendChild(el('div',{class:'empty'},[el('h3',{},['No books found']), el('p',{},['Try a different search term, or check back when more books are added to the shop.'])]));
    }else{
      const grid = el('div',{class:'grid'});
      books.forEach(b=>grid.appendChild(bookCard(b)));
      wrap.appendChild(grid);

  function cartView(){
    const wrap = el('div');
    wrap.appendChild(el('div',{class:'page-head'},[
      el('div',{},[ el('h1',{},['Your cart']), el('p',{},['Review your books before checking out.']) ])
    ]));
    const items = cartItems();
    if(items.length===0){
      wrap.appendChild(el('div',{class:'panel'},[
        el('div',{class:'empty'},[ el('h3',{},['Cart is empty']), el('p',{},['Head back to the shop to add some books.']),
          el('button',{class:'btn btn-primary', onclick:()=>{ refreshCatalog(); setState({view:'shop'}); }, style:'margin-top:10px;'},['Browse books']) ])
      ]));
      return wrap;
    }
    const panel = el('div',{class:'panel'});
    items.forEach(item=>{
      const avail = availableStock(item) + item.qty; // qty already reserved in cart counts toward what THIS buyer can hold
      const row = el('div',{class:'cart-row'});
      row.appendChild(coverEl(item,'mini-cover'));
      const info = el('div',{},[
        el('div',{class:'title', style:'font-size:15px;'},[item.title]),
        el('div',{class:'meta'},[[item.genre,item.type].filter(Boolean).join(' · ')])
      ]);
      row.appendChild(info);
      row.appendChild(el('div',{class:'meta'},[item.box?('📦 '+item.box):'']));
      const qtyInput = el('input',{class:'qty-input', type:'number', min:'1', max:String(avail), value:String(item.qty)});
      qtyInput.addEventListener('change', e=>setCartQty(item.id, parseInt(e.target.value||'1',10)));
      row.appendChild(qtyInput);
      row.appendChild(el('div',{style:'font-weight:600;'},[peso(item.price*item.qty)]));
      row.appendChild(el('button',{class:'btn-ghost btn btn-sm', onclick:()=>removeFromCart(item.id), title:'Remove'},['✕']));
      panel.appendChild(row);
    });
    const bar = el('div',{class:'cart-total-bar'},[
      el('div',{class:'meta'},[items.length+' item(s)']),
      el('div',{class:'sum'},['Total: '+peso(cartTotal())])
    ]);
    panel.appendChild(bar);
    panel.appendChild(el('div',{style:'margin-top:16px; text-align:right;'},[
      el('button',{class:'btn btn-primary', onclick:()=>setState({checkoutOpen:true, checkoutMode:'full'})},['Proceed to checkout →'])
    ]));
    wrap.appendChild(panel);
    wrap.appendChild(layawayPanel());
    return wrap;
  }

  // Shown under the cart. Below PHP 1,000 it just tells the buyer how much
  // more they need to add. At PHP 1,000+ it lets them pick a duration and
  // shows exactly what they'd pay now and on each remaining due date.
  function layawayPanel(){
    const subtotal = cartTotal();
    const panel = el('div',{class:'panel', style:'margin-top:20px;'});
    panel.appendChild(el('div',{class:'title', style:'font-size:17px; margin-bottom:4px;'},['📅 Pay by layaway']));

    if(subtotal < LAYAWAY_MIN){
      panel.appendChild(el('p',{class:'meta'},[
        'Layaway is available on orders of '+peso(LAYAWAY_MIN)+' and up. Add '+peso(LAYAWAY_MIN-subtotal)+' more to your cart to unlock it.'
      ]));
      return panel;
    }

    panel.appendChild(el('p',{class:'meta'},['Split your total into monthly payments. A layaway fee is added and is non-refundable once your first payment is in.']));

    const picker = el('div',{style:'display:flex; gap:8px; margin:14px 0; flex-wrap:wrap;'});
    LAYAWAY_PLANS.forEach(p=>{
      const active = state.layawayMonths===p.months;
      picker.appendChild(el('button',{
        class:'btn btn-sm '+(active?'btn-primary':'btn-outline'),
        onclick:()=>setState({layawayMonths:p.months})
      },[p.months+' month'+(p.months>1?'s':'')+' (+'+peso(p.fee)+')']));
    });
    panel.appendChild(picker);

    const sched = buildLayawaySchedule(subtotal, state.layawayMonths);
    const table = el('table',{class:'admin-table'});
    const thead = el('thead',{},[el('tr',{},[el('th',{},['Payment']),el('th',{},['When']),el('th',{},['Amount'])])]);
    table.appendChild(thead);
    const tbody = el('tbody');
    sched.payments.forEach((p,i)=>{
      tbody.appendChild(el('tr',{},[
        el('td',{},[i===0?'Down payment':('Payment '+(i+1))]),
        el('td',{},[p.label]),
        el('td',{style:'font-weight:600;'},[peso(p.amount)])
      ]));
    });
    table.appendChild(tbody);
    panel.appendChild(table);

    panel.appendChild(el('div',{class:'cart-total-bar'},[
      el('div',{class:'meta'},['Books '+peso(sched.subtotal)+' + layaway fee '+peso(sched.fee)]),
      el('div',{class:'sum'},['Total: '+peso(sched.total)])
    ]));

    panel.appendChild(el('div',{style:'margin-top:14px; text-align:right;'},[
      el('button',{class:'btn btn-outline', onclick:()=>setState({checkoutOpen:true, checkoutMode:'layaway'})},
        ['Reserve via layaway — pay '+peso(sched.payments[0].amount)+' now →'])
    ]));

    return panel;
  }

  function checkoutModal(){
    if(!state.checkoutOpen) return null;
    const isLayaway = state.checkoutMode==='layaway';
    const subtotal = cartTotal();
    const plan = isLayaway ? buildLayawaySchedule(subtotal, state.layawayMonths) : null;
    const dueNow = isLayaway ? plan.payments[0].amount : subtotal;

    const backdrop = el('div',{class:'modal-backdrop', onclick:(e)=>{ if(e.target===backdrop) setState({checkoutOpen:false}); }});
    const modal = el('div',{class:'modal'});
    modal.appendChild(el('button',{class:'modal-close', onclick:()=>setState({checkoutOpen:false})},['×']));
    modal.appendChild(el('h2',{},[isLayaway?'Checkout — Layaway':'Checkout']));

    if(isLayaway){
      modal.appendChild(el('p',{class:'meta', style:'margin-top:-8px;'},[
        plan.months+'-month layaway · order total '+peso(plan.total)+' (books '+peso(plan.subtotal)+' + fee '+peso(plan.fee)+')'
      ]));
      const schedBox = el('div',{style:'background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:10px 12px; margin-bottom:16px;'});
      plan.payments.forEach((p,i)=>{
        schedBox.appendChild(el('div',{class:'meta', style:'display:flex; justify-content:space-between; padding:3px 0;'+(i===0?'font-weight:700;color:var(--ink);':'')},[
          el('span',{},[i===0?'Down payment (today)':('Payment '+(i+1)+' — '+p.label)]),
          el('span',{},[peso(p.amount)])
        ]));
      });
      modal.appendChild(schedBox);
      modal.appendChild(el('p',{class:'meta', style:'margin-bottom:16px;'},[
        'You\'re paying '+peso(dueNow)+' now to reserve these books. The layaway fee is non-refundable, and missed payments follow the layaway rules — see Rules & Layaway.'
      ]));
    } else {
      modal.appendChild(el('p',{class:'meta', style:'margin-top:-8px; margin-bottom:16px;'},['Total due: '+peso(dueNow)]));
    }

    const form = el('div');
    const nameField = el('div',{class:'field'},[ el('label',{},['Full name']), el('input',{type:'text', id:'ck-name', placeholder:'Juan Dela Cruz'}) ]);
    const contactField = el('div',{class:'field'},[ el('label',{},['Phone number']), el('input',{type:'tel', id:'ck-contact', placeholder:'09XX XXX XXXX'}) ]);
    form.appendChild(nameField);
    form.appendChild(contactField);

    form.appendChild(el('div',{class:'field', style:'margin-top:16px; border-top:1px solid var(--line); padding-top:12px;'},[
      el('label',{style:'font-weight:700; display:block; margin-bottom:8px;'},['📸 Proof of Payment — '+peso(dueNow)+' (REQUIRED)'])
    ]));
    
    const proofContainer = el('div',{style:'position:relative; margin-bottom:12px;'});
    const proofInput = el('input',{type:'file', id:'ck-payment-proof', accept:'image/*', style:'display:none;'});
    const proofPreview = el('div',{id:'ck-proof-preview', style:'width:100%; height:120px; border:2px dashed var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--paper); cursor:pointer;'});
    proofPreview.appendChild(el('span',{class:'meta'},['Tap to upload proof of GCash payment']));
    proofContainer.appendChild(proofPreview);
    proofContainer.appendChild(proofInput);
    
    let proofImageData = null;
    proofPreview.addEventListener('click', ()=>proofInput.click());
    proofInput.addEventListener('change', async (e)=>{
      const file = e.target.files?.[0];
      if(!file) return;
      try {
        proofImageData = await compressImageFile(file);
        const img = el('img',{src:proofImageData, style:'width:100%; height:100%; object-fit:cover; border-radius:6px;'});
        proofPreview.innerHTML = '';
        proofPreview.appendChild(img);
      } catch(err) {

    form.appendChild(proofContainer);
    form.appendChild(el('p',{class:'meta', style:'font-size:11px; margin-top:8px; color:var(--muted);'},['Take a screenshot or photo of your GCash transfer confirmation']));

      el('div',{class:'meta'},['Payment Method'])
    ]));
    
    form.appendChild(el('div',{style:'background:var(--primary-soft); padding:12px; border-radius:8px; text-align:center; font-weight:600;'},['💳 GCash Payment Only']));

    const submitBtn = el('button',{class:'btn btn-primary', style:'width:100%; justify-content:center; margin-top:16px; padding:12px;'},
      [isLayaway ? ('Reserve & Send Proof of '+peso(dueNow)) : 'Place Order & Send Proof']);
    submitBtn.addEventListener('click', ()=>{
      const name = document.getElementById('ck-name').value.trim();
      const contact = document.getElementById('ck-contact').value.trim();
      if(!name||!contact){ showToast('Please fill in all fields'); return; }
      if(!proofImageData) { showToast('Please upload proof of payment (screenshot of GCash transfer)'); return; }
      placeOrder({name, contact, address:'', paymentMode: isLayaway?'Layaway (GCash)':'GCash', proofOfPayment:proofImageData, layawayPlan: isLayaway?plan:null});
    });
    form.appendChild(submitBtn);
    form.appendChild(el('p',{class:'meta', style:'margin-top:10px; text-align:center; font-size:11px;'},['Your order will be confirmed after payment is verified.']));

    modal.appendChild(form);
    backdrop.appendChild(modal);
    return backdrop;
  }

        ]));
      });

    }

    // Show payment details based on method
    if(o && (o.paymentMode === 'GCash' || o.paymentMode === 'Layaway (GCash)')) {
      const payment = getSellerPayment();
      if(payment.gcashQR) {
        const qrSection = el('div', {style:'margin:20px 0; text-align:center;'});
        qrSection.appendChild(el('p',{class:'meta'},['Scan or save this QR code to pay via GCash:']));
        const img = el('img', {src:payment.gcashQR, style:'max-width:200px; border:1px solid var(--line); border-radius:6px; padding:8px; background:white; margin:12px 0; cursor:zoom-in;', title:'Tap to enlarge', onclick:()=>openLightbox(payment.gcashQR, 'GCash QR Code')});
        qrSection.appendChild(img);
        if(payment.gcashNumber) {
          qrSection.appendChild(el('p',{class:'meta'},['Or send to: <strong>'+payment.gcashNumber+'</strong>']));
        }
        qrSection.appendChild(el('p',{class:'meta', style:'font-size:12px; color:var(--ink-soft);'},['Reference: '+o.id]));
        panel.appendChild(qrSection);
      } else if(payment.gcashNumber) {
        panel.appendChild(el('p',{class:'meta', style:'margin-top:12px;'},['Send to GCash: <strong>'+payment.gcashNumber+'</strong><br>Reference: '+o.id]));
      }
    }
    
    panel.appendChild(el('p',{class:'meta'},['Save your Order ID for your records.']));
    panel.appendChild(el('button',{class:'btn btn-primary', style:'margin-top:14px;', onclick:()=>{ refreshCatalog(); setState({view:'shop'}); }},['Back to shop']));
    wrap.appendChild(panel);
    return wrap;
  }

  function paymentInfoView(){
    const wrap = el('div');
    wrap.appendChild(el('div',{class:'page-head'},[ el('div',{},[ el('h1',{},['Modes of payment']) ]) ]));
    const panel = el('div',{class:'panel'});
    
    const payment = getSellerPayment();
    let gcashContent = '<div class="meta">Send to the GCash number provided after checkout. Use your Order ID as the reference note.</div>';
    
    if(payment.gcashQR || payment.gcashNumber) {
      gcashContent = '<div style="text-align:center;padding:12px 0;">';
      if(payment.gcashQR) {
        gcashContent += '<img src="'+payment.gcashQR+'" id="bn-gcash-qr-img" title="Tap to enlarge" style="max-width:150px;border:1px solid var(--line);border-radius:6px;padding:6px;background:white;margin-bottom:8px;cursor:zoom-in;" /><br>';
      }
      if(payment.gcashNumber) {
        gcashContent += '<strong style="font-size:16px;">'+payment.gcashNumber+'</strong><br>';
      }
      gcashContent += '<div class="meta" style="margin-top:8px;">Use your Order ID as reference</div></div>';
    }
    
    panel.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:18px;">
        <div>
          <div class="title" style="font-size:16px;">GCash</div>
          ${gcashContent}
        </div>
        <div>
          <div class="title" style="font-size:16px;">Bank Transfer</div>
          <div class="meta">Bank details are shared after checkout. Please screenshot your receipt and keep it until your order ships.</div>
        </div>
        <div class="meta" style="border-top:1px solid var(--line); padding-top:14px;">
          Orders are held for 48 hours pending payment. Unpaid orders past that window may be released back into stock.
        </div>
      </div>`;
    wrap.appendChild(panel);
    const qrImg = panel.querySelector('#bn-gcash-qr-img');
    if(qrImg) qrImg.addEventListener('click', ()=>openLightbox(payment.gcashQR, 'GCash QR Code'));
    return wrap;
  }

  // ---------- main render ----------
  function render(){
    const root = document.getElementById('root');
    root.innerHTML = '';
    const app = el('div',{class:'app'});

    const spine = el('div',{class:'spine'});
    spine.appendChild(el('div',{class:'brand'},[
      el('div',{class:'brand-mark'},['BookNest']),
      el('div',{class:'brand-sub'},['PRE-LOVED BOOKS'])
    ]));
    spine.appendChild(navItem('shop','Shop'));
    spine.appendChild(navItem('cart','Cart', cartCount()||null));
    spine.appendChild(navItem('payment','Payment info'));
    spine.appendChild(el('a',{class:'nav-item', href:'rules.html'},['📋 Rules & Layaway']));

    spine.appendChild(el('div',{class:'spine-footer'},['© '+new Date().getFullYear()+' BookNest']));
    app.appendChild(spine);

    const main = el('div',{class:'main'});
    if(state.view==='shop') main.appendChild(shopView());
    else if(state.view==='cart') main.appendChild(cartView());
    else if(state.view==='confirm') main.appendChild(confirmView());
    else if(state.view==='payment') main.appendChild(paymentInfoView());
    app.appendChild(main);

    root.appendChild(app);

    const modal = checkoutModal();
    if(modal) root.appendChild(modal);

    const bookModal = bookDetailModal();
    if(bookModal) root.appendChild(bookModal);

    const lb = lightboxOverlay();
    if(lb) root.appendChild(lb);

    if(state.toast){
      const t = el('div',{style:'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--white); padding:10px 18px; border-radius:4px; font-size:13.5px; z-index:100;'},[state.toast]);
      root.appendChild(t);
    }
  }

  render();
})();
</script>
</body>
</html>
