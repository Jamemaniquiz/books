<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buyer Login & Sign Up — BookNest</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-data.js"></script><script src="site-status.js"></script><style>:root{--paper:#f8f3e7;--ink:#26211a;--muted:#665f52;--green:#35493c;--brick:#a8402a;--line:#d9cdb2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,sans-serif;background:linear-gradient(150deg,#35493c,#263329)}.box{width:min(480px,100%);background:var(--paper);border-radius:24px;padding:32px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.brand{text-align:center}.brand img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:18px;padding:6px}.brand h1{font:600 30px Fraunces,serif;color:#263329;margin:12px 0 3px}.sub{font-size:11px;letter-spacing:.12em;color:var(--muted)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:25px 0 18px}.tabs button{padding:12px;border:1px solid var(--line);background:#fffaf0;border-radius:999px;font-weight:800;cursor:pointer}.tabs button.active{background:var(--green);color:#fff}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff}.btn{width:100%;padding:13px;border:0;border-radius:999px;background:var(--brick);color:#fff;font-weight:800;cursor:pointer;margin-top:10px}.guest{background:transparent;color:var(--green);border:1px solid var(--line)}.msg{min-height:22px;font-size:12px;margin:12px 0;color:var(--muted);line-height:1.5}.links{text-align:center;margin-top:15px}.links a{color:var(--green);font-weight:700;font-size:12px;text-decoration:none}</style></head><body><div class="box"><div class="brand"><img src="logo.png" alt="BookNest logo"><h1>BookNest</h1><div class="sub">BUYER ACCOUNT</div><div style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4">New here? Create your buyer account below. You can also continue as a guest.</div></div><div class="tabs"><button id="loginTab" class="active">Log In</button><button id="signupTab">Sign Up</button></div><div id="loginForm"><div id="resetForm" style="display:none"><div class="field"><label>New password</label><input id="resetPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><button class="btn" id="resetBtn">Set New Password</button></div><div id="normalLogin"><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password"></div><button class="btn" id="loginBtn">Log In</button><button class="btn guest" id="forgotBtn" type="button">Forgot Password</button></div></div><div id="signupForm" style="display:none"><div class="field"><label>Full name</label><input id="signupName" type="text" autocomplete="name" placeholder="Juan Dela Cruz"></div><div class="field"><label>Phone number</label><input id="signupPhone" type="tel" autocomplete="tel" placeholder="09XX XXX XXXX"></div><div class="field"><label>Complete shipping address</label><input id="signupAddress" type="text" autocomplete="street-address" placeholder="House / Street / Barangay / City / Province"></div><div class="field"><label>Facebook (optional)</label><input id="signupFacebook" type="text" autocomplete="url" placeholder="Facebook profile name or link"></div><div class="field"><label>Email</label><input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><button class="btn" id="signupBtn">Create Account</button></div><div class="msg" id="msg"></div><button class="btn guest" id="guestBtn">Continue as Guest</button><div class="links"><a href="index.html">← Back to BookNest</a></div><script>
const client=window.supabase.createClient(window.BOOKNEST_SUPABASE_URL,window.BOOKNEST_SUPABASE_ANON_KEY,{auth:{persistSession:true}});
const $=id=>document.getElementById(id);
function msg(t){$('msg').textContent=t}
function tab(sign){$('loginForm').style.display=sign?'none':'';$('signupForm').style.display=sign?'':'none';$('loginTab').classList.toggle('active',!sign);$('signupTab').classList.toggle('active',sign);if($('normalLogin'))$('normalLogin').style.display='';if($('resetForm'))$('resetForm').style.display='none';msg('')}
$('loginTab').onclick=()=>tab(false);$('signupTab').onclick=()=>tab(true);
if(location.hash==='#signup') tab(true); else tab(false);
if(location.hash==='#reset' || location.hash.includes('type=recovery')){
  tab(false);
  $('normalLogin').style.display='none'; $('resetForm').style.display='';
  msg('Enter a new password for your account.');
}
$('resetBtn').onclick=async()=>{const pw=$('resetPassword').value;if(pw.length<6){msg('Password must be at least 6 characters.');return}msg('Updating password…');const {error}=await client.auth.updateUser({password:pw});if(error){msg(error.message);return}msg('Password changed successfully. You can now log in.');$('resetPassword').value='';history.replaceState({},document.title,location.pathname);$('normalLogin').style.display='';$('resetForm').style.display='none';};
$('loginBtn').onclick=async()=>{msg('Signing in…');const {data,error}=await client.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error){msg(error.message);return}try{sessionStorage.setItem('booknest_buyer_identity',JSON.stringify({type:'user',id:data.user.id,email:data.user.email||''}));sessionStorage.removeItem('booknest_guest_id');sessionStorage.removeItem('booknest_buyer_profile')}catch(e){}location.href='shop.html'};
$('forgotBtn').onclick=async()=>{const email=$('loginEmail').value.trim();if(!email){msg('Enter your account email first, then click Forgot Password.');return}msg('Sending password reset email…');const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'#reset'});if(error){msg(error.message);return}msg('Password reset email sent. Check your inbox and follow the Supabase reset link.');};
$('signupBtn').onclick=async()=>{const name=$('signupName').value.trim(),phone=$('signupPhone').value.trim(),address=$('signupAddress').value.trim(),facebook=$('signupFacebook').value.trim(),email=$('signupEmail').value.trim(),password=$('signupPassword').value;if(!name||!phone||!address||!email){msg('Please complete your name, phone, address, and email.');return}if(password.length<6){msg('Password must be at least 6 characters.');return}msg('Creating account…');const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name:name,phone,address,facebook}}});if(error){msg(error.message);return}if(data.session){try{sessionStorage.setItem('booknest_buyer_identity',JSON.stringify({type:'user',id:data.user.id,email:data.user.email||email}));sessionStorage.setItem('booknest_buyer_profile',JSON.stringify({name,contact:phone,address,facebook}));sessionStorage.removeItem('booknest_guest_id')}catch(e){}location.href='shop.html';}else msg('Account created. Check your email if Supabase requires email confirmation, then log in.');};
$('guestBtn').onclick=()=>{try{const id='guest-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);sessionStorage.setItem('booknest_guest_id',id);sessionStorage.setItem('booknest_buyer_identity',JSON.stringify({type:'guest',id}));sessionStorage.removeItem('booknest_buyer_profile')}catch(e){}location.href='shop.html'};
</script></body></html>
