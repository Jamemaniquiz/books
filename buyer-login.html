<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="performance.js" defer></script><title>Buyer Login & Sign Up — BookNest</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-data.js"></script><script src="site-status.js"></script><style>:root{--paper:#f8f3e7;--ink:#26211a;--muted:#665f52;--green:#35493c;--brick:#a8402a;--line:#d9cdb2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,sans-serif;background:linear-gradient(150deg,#35493c,#263329)}.box{width:min(480px,100%);background:var(--paper);border-radius:24px;padding:32px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.brand{text-align:center}.brand img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:18px;padding:6px}.brand h1{font:600 30px Fraunces,serif;color:#263329;margin:12px 0 3px}.sub{font-size:11px;letter-spacing:.12em;color:var(--muted)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:25px 0 18px}.tabs button{padding:12px;border:1px solid var(--line);background:#fffaf0;border-radius:999px;font-weight:800;cursor:pointer}.tabs button.active{background:var(--green);color:#fff}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff}.btn{width:100%;padding:13px;border:0;border-radius:999px;background:var(--brick);color:#fff;font-weight:800;cursor:pointer;margin-top:10px}.guest{background:transparent;color:var(--green);border:1px solid var(--line)}.msg{min-height:22px;font-size:12px;margin:12px 0;color:var(--muted);line-height:1.5}.links{text-align:center;margin-top:15px}.links a{color:var(--green);font-weight:700;font-size:12px;text-decoration:none}</style><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="//cdn.jsdelivr.net">
</head><body><div class="box"><div class="brand"><img src="logo.png" alt="BookNest logo"><h1>BookNest</h1><div class="sub">BUYER ACCOUNT</div><div style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4">New here? Create your buyer account below. You can also continue as a guest.</div></div><div class="tabs"><button id="loginTab" class="active">Log In</button><button id="signupTab">Sign Up</button></div><div id="loginForm"><div id="resetForm" style="display:none"><div class="field"><label>New password</label><input id="resetPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><button class="btn" id="resetBtn">Set New Password</button></div><div id="normalLogin"><div class="field"><label>Phone number</label><input id="loginEmail" type="tel" autocomplete="tel" placeholder="09XX XXX XXXX"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password"></div><button class="btn" id="loginBtn">Log In</button><button class="btn guest" id="forgotBtn" type="button">Forgot Password</button></div></div><div id="signupForm" style="display:none"><div class="field"><label>Full name</label><input id="signupName" type="text" autocomplete="name" placeholder="Juan Dela Cruz"></div><div class="field"><label>Phone number</label><input id="signupPhone" type="tel" autocomplete="tel" placeholder="09XX XXX XXXX"></div><div class="field"><label>Complete shipping address</label><input id="signupAddress" type="text" autocomplete="street-address" placeholder="House / Street / Barangay / City / Province"></div><div class="field"><label>Facebook (optional)</label><input id="signupFacebook" type="text" autocomplete="url" placeholder="Facebook profile name or link"></div><div class="field"><label>Password</label><input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div><button class="btn" id="signupBtn">Create Account</button></div><div class="msg" id="msg"></div><button class="btn guest" id="guestBtn">Continue as Guest</button><div class="links"><a href="index.html">← Back to BookNest</a></div><script>
const FB_URL='https://www.facebook.com/profile.php?id=61573580501585';
const TT_URL='https://www.tiktok.com/@booknest123';
const $=id=>document.getElementById(id);
function msg(t){$('msg').innerHTML=t}
function tab(sign){$('loginForm').style.display=sign?'none':'';$('signupForm').style.display=sign?'':'none';$('loginTab').classList.toggle('active',!sign);$('signupTab').classList.toggle('active',sign);if($('normalLogin'))$('normalLogin').style.display='';if($('resetForm'))$('resetForm').style.display='none';msg('')}
$('loginTab').onclick=()=>tab(false);$('signupTab').onclick=()=>tab(true);
if(location.hash==='#signup') tab(true); else tab(false);
if(location.hash==='#reset'){$('normalLogin').style.display='';tab(false);msg(`<strong>Forgot your password?</strong><br><span style="display:block;margin-top:6px">Please contact BookNest seller to get your password.</span><div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap"><a class="btn guest" style="width:auto;padding:10px 14px" href="${FB_URL}" target="_blank" rel="noopener noreferrer">Facebook</a><a class="btn guest" style="width:auto;padding:10px 14px" href="${TT_URL}" target="_blank" rel="noopener noreferrer">TikTok</a></div>`)}
async function hashPassword(password){const data=new TextEncoder().encode(password);const hash=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function readAccounts(){try{return JSON.parse(localStorage.getItem('.buyer_accounts')||'[]')||[]}catch(e){return[]}}
function saveAccounts(v){try{localStorage.setItem('.buyer_accounts',JSON.stringify(v));return true}catch(e){return false}}
async function cloudSaveAccounts(v){try{if(window.BookNestCloud?.enabled) await window.BookNestCloud.save('.buyer_accounts',v)}catch(e){console.warn('buyer account cloud save failed',e)}}
async function ensureAccounts(){try{await window.BookNestCloud?.ready}catch(e){} return readAccounts()}
$('loginBtn').onclick=async()=>{
  const phone=$('loginEmail').value.trim().replace(/\D/g,''); const password=$('loginPassword').value;
  if(!phone||!password){msg('Please enter your phone number and password.');return}
  msg('Signing in…'); const accounts=await ensureAccounts(); const account=accounts.find(a=>String(a.phone||'').replace(/\D/g,'')===phone && !a.deleted);
  if(!account){msg('No buyer account was found for that phone number.');return}
  const hash=await hashPassword(password);
  if(hash!==account.passwordHash){msg('Incorrect password. If you forgot it, contact the BookNest seller.');return}
  const identity={type:'user',id:account.id,phone:account.phone};
  try{sessionStorage.setItem('booknest_buyer_identity',JSON.stringify(identity));sessionStorage.setItem('booknest_buyer_profile',JSON.stringify({name:account.name||'',contact:account.phone||'',address:account.address||'',facebook:account.facebook||''}));sessionStorage.removeItem('booknest_guest_id')}catch(e){}
  location.href='shop.html';
};
$('forgotBtn').onclick=()=>msg(`<strong>Forgot your password?</strong><br><span style="display:block;margin-top:6px">Do not create a new account. Contact the BookNest seller to know your password.</span><div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap"><a class="btn guest" style="width:auto;padding:10px 14px" href="${FB_URL}" target="_blank" rel="noopener noreferrer">Facebook</a><a class="btn guest" style="width:auto;padding:10px 14px" href="${TT_URL}" target="_blank" rel="noopener noreferrer">TikTok</a></div>`);
$('signupBtn').onclick=async()=>{
  const name=$('signupName').value.trim(),phoneRaw=$('signupPhone').value.trim(),phone=phoneRaw.replace(/\D/g,''),address=$('signupAddress').value.trim(),facebook=$('signupFacebook').value.trim(),password=$('signupPassword').value;
  if(!name||!phone||!address){msg('Please complete your name, phone number, and address.');return}
  if(phone.length<10){msg('Please enter a valid Philippine phone number.');return}
  if(password.length<6){msg('Password must be at least 6 characters.');return}
  const accounts=await ensureAccounts(); if(accounts.some(a=>!a.deleted&&String(a.phone||'').replace(/\D/g,'')===phone)){msg('An account with this phone number already exists. Please log in.');return}
  msg('Creating account…');
  const passwordHash=await hashPassword(password);
  const account={id:'buyer-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10),name,phone:phoneRaw,address,facebook,password,passwordHash,createdAt:new Date().toISOString(),deleted:false};
  const next=[account,...accounts]; if(!saveAccounts(next)){msg('Could not save the account on this device.');return}
  await cloudSaveAccounts(next);
  try{sessionStorage.setItem('booknest_buyer_identity',JSON.stringify({type:'user',id:account.id,phone:account.phone}));sessionStorage.setItem('booknest_buyer_profile',JSON.stringify({name,contact:phoneRaw,address,facebook}));sessionStorage.removeItem('booknest_guest_id')}catch(e){}
  location.href='shop.html';
};
$('guestBtn').onclick=()=>{try{const id='guest-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);sessionStorage.setItem('booknest_guest_id',id);sessionStorage.setItem('booknest_buyer_identity',JSON.stringify({type:'guest',id}));sessionStorage.removeItem('booknest_buyer_profile')}catch(e){}location.href='shop.html'};
window.addEventListener('booknest-cloud-ready',()=>{ });
</script><script src="mobile-enhancements.js"></script>
</body></html>
