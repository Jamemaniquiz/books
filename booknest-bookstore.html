<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookNest — Pre-loved Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE7D8;
    --paper-light:#F8F3E7;
    --ink:#26211A;
    --ink-soft:#5B5344;
    --spine:#35493C;
    --spine-dark:#263329;
    --spine-light:#4A6151;
    --brick:#A8402A;
    --brick-dark:#8A3220;
    --brass:#9C7A34;
    --line:#D9CDB2;
    --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.serif{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* SPINE NAV */
  .spine{
    width:220px;
    flex-shrink:0;
    background:var(--spine);
    color:var(--white);
    display:flex;
    flex-direction:column;
    padding:28px 0;
    position:relative;
  }
  .spine::after{
    content:"";
    position:absolute;
    right:0;top:0;bottom:0;
    width:6px;
    background:linear-gradient(90deg, rgba(0,0,0,0.18), transparent);
  }
  .brand{
    padding:0 22px 24px 22px;
    border-bottom:1px solid rgba(255,255,255,0.14);
    margin-bottom:18px;
  }
  .brand-mark{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:26px;
    line-height:1.1;
    color:var(--white);
  }
  .brand-sub{
    font-size:11px;
    letter-spacing:0.04em;
    color:rgba(255,255,255,0.55);
    margin-top:6px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 22px;
    color:rgba(255,255,255,0.72);
    cursor:pointer;
    font-size:14.5px;
    border-left:3px solid transparent;
    transition:background 0.15s, color 0.15s;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:var(--white); }
  .nav-item.active{
    background:rgba(255,255,255,0.09);
    color:var(--white);
    border-left:3px solid var(--brick);
  }
  .nav-badge{
    margin-left:auto;
    background:var(--brick);
    color:var(--white);
    font-size:11px;
    padding:1px 7px;
    border-radius:9px;
    min-width:18px;
    text-align:center;
  }
  .spine-footer{
    margin-top:auto;
    padding:14px 22px 0 22px;
    font-size:11.5px;
    color:rgba(255,255,255,0.4);
    border-top:1px solid rgba(255,255,255,0.1);
    padding-top:14px;
  }

  /* MAIN */
  .main{ flex:1; padding:36px 44px; max-width:1200px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .page-head h1{ font-size:30px; margin:0; }
  .page-head p{ margin:4px 0 0 0; color:var(--ink-soft); font-size:14.5px; }

  .toolbar{ display:flex; gap:10px; align-items:center; }
  input[type=text], input[type=number], input[type=tel], input[type=password], select, textarea{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 12px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    border-radius:3px;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--spine-light); outline-offset:1px; }

  .btn{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:9px 16px;
    border-radius:3px;
    border:1px solid transparent;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary{ background:var(--brick); color:var(--white); }
  .btn-primary:hover{ background:var(--brick-dark); }
  .btn-primary:disabled{ background:#C7BBA5; cursor:not-allowed; }
  .btn-outline{ background:transparent; border-color:var(--ink); color:var(--ink); }
  .btn-outline:hover{ background:var(--ink); color:var(--white); }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
  .btn-ghost:hover{ border-color:var(--ink); color:var(--ink); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }
  .btn-danger{ background:transparent; color:var(--brick); border-color:var(--brick); }
  .btn-danger:hover{ background:var(--brick); color:var(--white); }

  .notice{
    background:#F4E4DD;
    border:1px solid #E2B7A6;
    color:var(--brick-dark);
    padding:16px 20px;
    border-radius:3px;
    font-size:13.5px;
    line-height:1.6;
    margin-bottom:24px;
  }
  .notice b{ display:block; font-size:12px; letter-spacing:0.06em; margin-bottom:4px; }

  /* GRID */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(215px, 1fr));
    gap:20px;
  }
  .card{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:3px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .shelf-tab{
    position:absolute;
    top:10px; left:0;
    background:var(--spine);
    color:var(--white);
    font-size:10.5px;
    letter-spacing:0.03em;
    padding:3px 9px 3px 8px;
    border-radius:0 3px 3px 0;
    z-index:2;
  }
  .cover{
    height:190px;
    background:linear-gradient(160deg, var(--spine-light), var(--spine-dark));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    position:relative;
  }
  .cover img{ width:100%; height:100%; object-fit:cover; }
  .cover-fallback{
    text-align:center;
    color:rgba(255,255,255,0.92);
  }
  .cover-fallback .t{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; line-height:1.25; }
  .cover-fallback .a{ font-size:10.5px; margin-top:8px; color:rgba(255,255,255,0.6); letter-spacing:0.03em; text-transform:uppercase; }
  .stock-flag{
    position:absolute; top:10px; right:10px;
    background:var(--brass); color:var(--white);
    font-size:10px; font-weight:700; letter-spacing:0.03em;
    padding:3px 7px; border-radius:2px;
  }
  .stock-flag.out{ background:#8a8a8a; }
  .card-body{ padding:14px 15px 15px 15px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .price{ color:var(--brick); font-weight:700; font-size:14.5px; }
  .title{ font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; line-height:1.25; margin:1px 0 2px 0; }
  .meta{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .card-actions{ margin-top:10px; display:flex; gap:8px; }
  .card-actions .btn{ flex:1; justify-content:center; }

  .empty{ padding:60px 20px; text-align:center; color:var(--ink-soft); }
  .empty h3{ margin-bottom:8px; }

  /* CART / TABLE */
  .cart-row{
    display:grid;
    grid-template-columns:64px 1fr 110px 90px 90px 32px;
    gap:14px;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-row .mini-cover{ width:48px; height:64px; border-radius:2px; background:linear-gradient(160deg, var(--spine-light), var(--spine-dark)); }
  .cart-row .mini-cover img{ width:100%; height:100%; object-fit:cover; border-radius:2px; }
  .qty-input{ width:56px; text-align:center; }
  .cart-total-bar{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 0 0 0; margin-top:6px;
  }
  .cart-total-bar .sum{ font-family:'Fraunces',serif; font-size:22px; }

  .panel{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:3px;
    padding:24px;
  }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-grid.full{ grid-template-columns:1fr; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-span2{ grid-column:1/-1; }

  table.admin-table{ width:100%; border-collapse:collapse; }
  table.admin-table th{ text-align:left; font-size:11.5px; letter-spacing:0.04em; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line); }
  table.admin-table td{ padding:10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  table.admin-table tr:hover td{ background:rgba(53,73,60,0.04); }

  .order-card{ border:1px solid var(--line); border-radius:3px; margin-bottom:14px; background:var(--paper-light); overflow:hidden; }
  .order-head{ display:flex; justify-content:space-between; align-items:center; padding:14px 18px; background:rgba(53,73,60,0.05); border-bottom:1px solid var(--line); flex-wrap:wrap; gap:8px; }
  .order-id{ font-family:'Fraunces',serif; font-weight:600; }
  .status-pill{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:10px; letter-spacing:0.02em; }
  .status-Pending{ background:#F1DCC4; color:#8A5A1F; }
  .status-Paid{ background:#D8E6D9; color:#2E5A34; }
  .status-Shipped{ background:#D6E1EC; color:#2A4A6B; }
  .status-Cancelled{ background:#E9D6D6; color:#8A2E2E; }
  .order-body{ padding:14px 18px; font-size:13.5px; }
  .order-body .line{ display:flex; justify-content:space-between; padding:3px 0; color:var(--ink-soft); }
  .order-actions{ padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(38,33,26,0.55);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--paper-light); border-radius:4px; max-width:480px; width:100%;
    padding:28px; max-height:88vh; overflow-y:auto;
  }
  .modal h2{ margin-top:0; font-size:22px; }
  .modal-close{ float:right; cursor:pointer; font-size:20px; color:var(--ink-soft); line-height:1; background:none;border:none; }

  .lock-screen{ max-width:340px; margin:60px auto; text-align:center; }
  .lock-screen .field{ margin:16px 0; text-align:left; }

  .pay-method{
    border:1px solid var(--line); border-radius:3px; padding:14px 16px; margin-bottom:10px;
    display:flex; align-items:center; gap:10px; cursor:pointer;
  }
  .pay-method.selected{ border-color:var(--spine); background:rgba(53,73,60,0.06); }

  .confirm-box{ text-align:center; padding:20px 0; }
  .confirm-box .big{ font-family:'Fraunces',serif; font-size:20px; margin:10px 0 4px 0; }

  ::placeholder{ color:#B3A98F; }

  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .spine{ width:100%; flex-direction:row; overflow-x:auto; padding:10px 0; }
    .brand{ display:none; }
    .nav-item{ padding:10px 16px; white-space:nowrap; border-left:none; border-bottom:3px solid transparent; }
    .nav-item.active{ border-left:none; border-bottom:3px solid var(--brick); }
    .spine-footer{ display:none; }
    .main{ padding:22px 18px; }
    .cart-row{ grid-template-columns:48px 1fr; grid-template-areas:"cover title" "cover meta" "cover controls"; row-gap:4px; }
    .form-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
(function(){

  // ---------- storage helpers ----------
  async function loadCatalog(){
    try{
      const r = await window.storage.get('catalog', true);
      return r ? JSON.parse(r.value) : seedCatalog();
    }catch(e){ return seedCatalog(); }
  }
  async function saveCatalog(books){
    await window.storage.set('catalog', JSON.stringify(books), true);
  }
  async function loadOrders(){
    try{
      const r = await window.storage.get('orders', true);
      return r ? JSON.parse(r.value) : [];
    }catch(e){ return []; }
  }
  async function saveOrders(orders){
    await window.storage.set('orders', JSON.stringify(orders), true);
  }

  function seedCatalog(){
    return [
      {id:'bk1', title:'The Core', author:'Peter V. Brett', price:150, format:'Hardcover', edition:'UK', condition:'Pre-loved — tanned, light foxing', shelf:'2113', stock:1, image:''},
      {id:'bk2', title:'Sons of Darkness', author:'Gourav Mohanty', price:180, format:'Hardcover', edition:'US, Remaindered', condition:'Minimal foxing', shelf:'2234', stock:1, image:''},
      {id:'bk3', title:'Heart Bones', author:'Colleen Hoover', price:180, format:'Hardcover', edition:'UK', condition:'Pre-loved — good shape', shelf:'5222', stock:2, image:''},
      {id:'bk4', title:'Defy the Night', author:'Brigid Kemmerer', price:240, format:'Hardcover', edition:'US, Remaindered', condition:'Light foxing', shelf:'5242', stock:1, image:''}
    ];
  }
  const uid = (p) => p + Math.random().toString(36).slice(2,9);
  const peso = (n) => 'PHP ' + Number(n).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});

  const ADMIN_CODE = 'foxed2026'; // simple client-side gate — not real security
  const ADMIN_PARAM = new URLSearchParams(window.location.search).has('admin'); // visit the page with ?admin at the end of the URL to reveal the Admin tab

  // ---------- state ----------
  let state = {
    view: ADMIN_PARAM ? 'admin' : 'shop',
    books:[],
    orders:[],
    cart:{}, // id -> qty  (in-memory only, resets on reload)
    loading:true,
    search:'',
    adminUnlocked:false,
    editingBook:null,   // book object being edited, or 'new'
    checkoutOpen:false,
    lastOrder:null,
    toast:null
  };

  function setState(patch){ state = {...state, ...patch}; render(); }

  function showToast(msg){
    setState({toast:msg});
    setTimeout(()=>{ if(state.toast===msg) setState({toast:null}); }, 2600);
  }

  // ---------- init ----------
  (async function init(){
    const [books, orders] = await Promise.all([loadCatalog(), loadOrders()]);
    setState({books, orders, loading:false});
  })();

  // ---------- cart logic ----------
  function cartCount(){ return Object.values(state.cart).reduce((a,b)=>a+b,0); }
  function cartItems(){
    return Object.entries(state.cart).map(([id,qty])=>{
      const book = state.books.find(b=>b.id===id);
      return book ? {...book, qty} : null;
    }).filter(Boolean);
  }
  function cartTotal(){ return cartItems().reduce((sum,i)=>sum+i.price*i.qty,0); }

  function addToCart(id){
    const book = state.books.find(b=>b.id===id);
    if(!book) return;
    const current = state.cart[id]||0;
    if(current >= book.stock){ showToast('No more stock available'); return; }
    setState({cart:{...state.cart, [id]:current+1}});
    showToast('Added to cart');
  }
  function setCartQty(id, qty){
    const book = state.books.find(b=>b.id===id);
    qty = Math.max(0, Math.min(qty, book?book.stock:qty));
    const next = {...state.cart};
    if(qty<=0){ delete next[id]; } else { next[id]=qty; }
    setState({cart:next});
  }
  function removeFromCart(id){
    const next = {...state.cart}; delete next[id]; setState({cart:next});
  }

  // ---------- admin: book CRUD ----------
  async function saveBook(book){
    let books;
    if(book.id){
      books = state.books.map(b=>b.id===book.id?book:b);
    }else{
      books = [...state.books, {...book, id:uid('bk')}];
    }
    await saveCatalog(books);
    setState({books, editingBook:null});
    showToast('Book saved');
  }
  async function deleteBook(id){
    const books = state.books.filter(b=>b.id!==id);
    await saveCatalog(books);
    setState({books});
    showToast('Book removed');
  }

  // ---------- checkout ----------
  async function placeOrder(buyer){
    const items = cartItems();
    if(items.length===0) return;
    const order = {
      id:'ORD-'+Date.now().toString(36).toUpperCase(),
      buyerName:buyer.name,
      contact:buyer.contact,
      address:buyer.address,
      paymentMode:buyer.paymentMode,
      items:items.map(i=>({id:i.id, title:i.title, price:i.price, qty:i.qty})),
      total:cartTotal(),
      status:'Pending',
      createdAt:new Date().toISOString()
    };
    // decrement stock
    const books = state.books.map(b=>{
      const item = items.find(i=>i.id===b.id);
      return item ? {...b, stock:Math.max(0,b.stock-item.qty)} : b;
    });
    const orders = [order, ...state.orders];
    await Promise.all([saveCatalog(books), saveOrders(orders)]);
    setState({books, orders, cart:{}, checkoutOpen:false, lastOrder:order, view:'confirm'});
  }

  async function setOrderStatus(orderId, status){
    const orders = state.orders.map(o=>o.id===orderId?{...o,status}:o);
    await saveOrders(orders);
    setState({orders});
  }

  // ---------- render helpers ----------
  function el(tag, attrs, children){
    const e = document.createElement(tag);
    attrs = attrs||{};
    for(const k in attrs){
      if(k==='class') e.className=attrs[k];
      else if(k==='html') e.innerHTML=attrs[k];
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }

  function navItem(key, label, badge){
    const active = state.view===key || (state.view==='confirm' && key==='shop');
    const item = el('div',{class:'nav-item'+(active?' active':''), onclick:()=>setState({view:key})},[label]);
    if(badge) item.appendChild(el('span',{class:'nav-badge'},[String(badge)]));
    return item;
  }

  function coverEl(book, sizeClass){
    const c = el('div',{class:sizeClass||'cover'});
    if(book.image){
      c.appendChild(el('img',{src:book.image, alt:book.title}));
    }else{
      c.appendChild(el('div',{class:'cover-fallback'},[
        el('div',{class:'t'},[book.title]),
        el('div',{class:'a'},[book.author||''])
      ]));
    }
    return c;
  }

  function bookCard(book){
    const out = book.stock<=0;
    const card = el('div',{class:'card'});
    card.appendChild(el('div',{class:'shelf-tab'},['Shelf #'+book.shelf]));
    const cov = coverEl(book,'cover');
    cov.appendChild(el('div',{class:'stock-flag'+(out?' out':'')},[out?'OUT':book.stock+' LEFT']));
    card.appendChild(cov);
    const body = el('div',{class:'card-body'});
    body.appendChild(el('div',{class:'price'},[peso(book.price)]));
    body.appendChild(el('div',{class:'title'},[book.title]));
    body.appendChild(el('div',{class:'meta'},[[book.format,book.edition].filter(Boolean).join(' · ')]));
    body.appendChild(el('div',{class:'meta'},[book.condition||'']));
    const actions = el('div',{class:'card-actions'});
    const addBtn = el('button',{class:'btn btn-primary', onclick:()=>addToCart(book.id)},['Add to cart']);
    if(out) addBtn.disabled = true;
    actions.appendChild(addBtn);
    body.appendChild(actions);
    card.appendChild(body);
    return card;
  }

  function shopView(){
    const wrap = el('div');
    wrap.appendChild(el('div',{class:'page-head'},[
      el('div',{},[
        el('h1',{},['All books']),
        el('p',{},['Browse what\'s currently on the shelf. Stock updates live as orders come in.'])
      ]),
      (function(){
        const tb = el('div',{class:'toolbar'});
        const input = el('input',{type:'text', placeholder:'Search title or author...', value:state.search});
        input.addEventListener('input', e=>setState({search:e.target.value}));
        tb.appendChild(input);
        return tb;
      })()
    ]));
    wrap.appendChild(el('div',{class:'notice'},[
      el('b',{},['NOTICE']),
      'Estimated ship-out is 2 weeks from date of payment confirmation. Pricing errors will be corrected before an order is confirmed — we\'ll always check with you first.'
    ]));
    const q = state.search.trim().toLowerCase();
    const books = state.books.filter(b => !q || b.title.toLowerCase().includes(q) || (b.author||'').toLowerCase().includes(q));
    if(state.loading){
      wrap.appendChild(el('div',{class:'empty'},[el('p',{},['Loading catalog...'])]));
    }else if(books.length===0){
      wrap.appendChild(el('div',{class:'empty'},[el('h3',{},['No books found']), el('p',{},['Try a different search term.'])]));
    }else{
      const grid = el('div',{class:'grid'});
      books.forEach(b=>grid.appendChild(bookCard(b)));
      wrap.appendChild(grid);
    }
    return wrap;
  }

  function cartView(){
    const wrap = el('div');
    wrap.appendChild(el('div',{class:'page-head'},[
      el('div',{},[ el('h1',{},['Your cart']), el('p',{},['Review your books before checking out.']) ])
    ]));
    const items = cartItems();
    if(items.length===0){
      wrap.appendChild(el('div',{class:'panel'},[
        el('div',{class:'empty'},[ el('h3',{},['Cart is empty']), el('p',{},['Head back to the shop to add some books.']),
          el('button',{class:'btn btn-primary', onclick:()=>setState({view:'shop'}), style:'margin-top:10px;'},['Browse books']) ])
      ]));
      return wrap;
    }
    const panel = el('div',{class:'panel'});
    items.forEach(item=>{
      const row = el('div',{class:'cart-row'});
      row.appendChild(coverEl(item,'mini-cover'));
      const info = el('div',{},[
        el('div',{class:'title', style:'font-size:15px;'},[item.title]),
        el('div',{class:'meta'},[[item.format,item.edition].filter(Boolean).join(' · ')])
      ]);
      row.appendChild(info);
      row.appendChild(el('div',{class:'meta'},['Shelf #'+item.shelf]));
      const qtyInput = el('input',{class:'qty-input', type:'number', min:'1', max:String(item.stock+item.qty), value:String(item.qty)});
      qtyInput.addEventListener('change', e=>setCartQty(item.id, parseInt(e.target.value||'1',10)));
      row.appendChild(qtyInput);
      row.appendChild(el('div',{style:'font-weight:600;'},[peso(item.price*item.qty)]));
      row.appendChild(el('button',{class:'btn-ghost btn btn-sm', onclick:()=>removeFromCart(item.id), title:'Remove'},['✕']));
      panel.appendChild(row);
    });
    const bar = el('div',{class:'cart-total-bar'},[
      el('div',{class:'meta'},[items.length+' item(s)']),
      el('div',{class:'sum'},['Total: '+peso(cartTotal())])
    ]);
    panel.appendChild(bar);
    panel.appendChild(el('div',{style:'margin-top:16px; text-align:right;'},[
      el('button',{class:'btn btn-primary', onclick:()=>setState({checkoutOpen:true})},['Proceed to checkout →'])
    ]));
    wrap.appendChild(panel);
    return wrap;
  }

  function checkoutModal(){
    if(!state.checkoutOpen) return null;
    const backdrop = el('div',{class:'modal-backdrop', onclick:(e)=>{ if(e.target===backdrop) setState({checkoutOpen:false}); }});
    const modal = el('div',{class:'modal'});
    modal.appendChild(el('button',{class:'modal-close', onclick:()=>setState({checkoutOpen:false})},['×']));
    modal.appendChild(el('h2',{},['Checkout']));
    modal.appendChild(el('p',{class:'meta', style:'margin-top:-8px; margin-bottom:16px;'},['Total due: '+peso(cartTotal())]));

    let selectedMode = 'GCash';

    const form = el('div');
    const nameField = el('div',{class:'field'},[ el('label',{},['Full name']), el('input',{type:'text', id:'ck-name', placeholder:'Juan Dela Cruz'}) ]);
    const contactField = el('div',{class:'field'},[ el('label',{},['Phone / FB name']), el('input',{type:'text', id:'ck-contact', placeholder:'09XX XXX XXXX or FB name'}) ]);
    const addressField = el('div',{class:'field'},[ el('label',{},['Delivery address']), el('textarea',{id:'ck-address', placeholder:'Complete address for shipping'}) ]);
    form.appendChild(nameField);
    form.appendChild(contactField);
    form.appendChild(addressField);

    form.appendChild(el('div',{class:'field', style:'margin-top:4px;'},[el('label',{},['Payment method'])]));
    const methods = ['GCash','Bank Transfer'];
    const methodWrap = el('div');
    methods.forEach(m=>{
      const opt = el('div',{class:'pay-method'+(m===selectedMode?' selected':'')},[
        el('input',{type:'radio', name:'paymode', checked:m===selectedMode?'checked':null, onchange:()=>{ selectedMode=m; render_methods(); }}),
        el('span',{},[m])
      ]);
      methodWrap.appendChild(opt);
    });
    function render_methods(){
      Array.from(methodWrap.children).forEach((child,i)=>{
        child.className = 'pay-method'+(methods[i]===selectedMode?' selected':'');
      });
    }
    form.appendChild(methodWrap);

    const submitBtn = el('button',{class:'btn btn-primary', style:'width:100%; justify-content:center; margin-top:8px;'},['Place order']);
    submitBtn.addEventListener('click', ()=>{
      const name = document.getElementById('ck-name').value.trim();
      const contact = document.getElementById('ck-contact').value.trim();
      const address = document.getElementById('ck-address').value.trim();
      if(!name||!contact||!address){ showToast('Please fill in all fields'); return; }
      placeOrder({name, contact, address, paymentMode:selectedMode});
    });
    form.appendChild(submitBtn);
    form.appendChild(el('p',{class:'meta', style:'margin-top:10px; text-align:center;'},['This creates your order. Payment instructions and confirmation come next — no card details needed here.']));

    modal.appendChild(form);
    backdrop.appendChild(modal);
    return backdrop;
  }

  function confirmView(){
    const o = state.lastOrder;
    const wrap = el('div');
    const panel = el('div',{class:'panel confirm-box'});
    panel.appendChild(el('div',{class:'meta'},['ORDER PLACED']));
    panel.appendChild(el('div',{class:'big'},[o?o.id:'']));
    panel.appendChild(el('p',{},['Thanks, '+(o?o.buyerName:'')+'! Please send '+peso(o?o.total:0)+' via '+(o?o.paymentMode:'')+' and keep your reference number.']));
    panel.appendChild(el('p',{class:'meta'},['Once we confirm your payment, your order status will change to "Paid" and we\'ll ship within 2 weeks. Check the Orders page any time using your order ID.']));
    panel.appendChild(el('button',{class:'btn btn-primary', style:'margin-top:14px;', onclick:()=>setState({view:'shop'})},['Back to shop']));
    wrap.appendChild(panel);
    return wrap;
  }

  function paymentInfoView(){
    const wrap = el('div');
    wrap.appendChild(el('div',{class:'page-head'},[ el('div',{},[ el('h1',{},['Modes of payment']) ]) ]));
    const panel = el('div',{class:'panel'});
    panel.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:18px;">
        <div>
          <div class="title" style="font-size:16px;">GCash</div>
          <div class="meta">Send to the GCash number provided after checkout. Use your Order ID as the reference note.</div>
        </div>
        <div>
          <div class="title" style="font-size:16px;">Bank Transfer</div>
          <div class="meta">Bank details are shared after checkout. Please screenshot your receipt and keep it until your order ships.</div>
        </div>
        <div class="meta" style="border-top:1px solid var(--line); padding-top:14px;">
          Orders are held for 48 hours pending payment. Unpaid orders past that window may be released back into stock.
        </div>
      </div>`;
    wrap.appendChild(panel);
    return wrap;
  }

  // ---------- Admin ----------
  function bookForm(existing){
    const isNew = !existing || existing==='new';
    const b = isNew ? {title:'',author:'',price:'',format:'Hardcover',edition:'',condition:'',shelf:'',stock:1,image:''} : {...existing};
    const wrap = el('div',{class:'panel'});
    wrap.appendChild(el('h3',{style:'margin-top:0;'},[isNew?'Add a book':'Edit book']));
    const grid = el('div',{class:'form-grid'});

    function field(label, key, type, span){
      const f = el('div',{class:'field'+(span?' field-span2':'')});
      f.appendChild(el('label',{},[label]));
      const input = el(type==='textarea'?'textarea':'input', type==='textarea'?{id:'f-'+key}:{id:'f-'+key, type:type});
      input.value = b[key]!==undefined ? b[key] : '';
      f.appendChild(input);
      return f;
    }
    grid.appendChild(field('Title','title','text'));
    grid.appendChild(field('Author','author','text'));
    grid.appendChild(field('Price (PHP)','price','number'));
    grid.appendChild(field('Stock','stock','number'));
    grid.appendChild(field('Format (e.g. Hardcover)','format','text'));
    grid.appendChild(field('Edition (e.g. UK, Remaindered)','edition','text'));
    grid.appendChild(field('Shelf number','shelf','text'));
    grid.appendChild(field('Condition notes','condition','textarea',true));
    wrap.appendChild(grid);

    // ---- photo: upload a file OR paste a URL, with live preview ----
    let pendingImage = b.image || '';
    const photoField = el('div',{class:'field', style:'margin-top:14px;'});
    photoField.appendChild(el('label',{},['Cover photo']));
    const photoRow = el('div',{style:'display:flex; gap:14px; align-items:flex-start;'});
    const preview = el('img',{style:'width:72px; height:98px; object-fit:cover; border-radius:2px; border:1px solid var(--line); background:var(--paper); display:'+(pendingImage?'block':'none')+';', src:pendingImage||''});
    const previewEmpty = el('div',{style:'width:72px; height:98px; border:1px dashed var(--line); border-radius:2px; display:'+(pendingImage?'none':'flex')+'; align-items:center; justify-content:center; font-size:10px; color:var(--ink-soft); text-align:center; padding:4px;'},['No photo yet']);
    photoRow.appendChild(preview);
    photoRow.appendChild(previewEmpty);
    const photoControls = el('div',{style:'flex:1; display:flex; flex-direction:column; gap:8px;'});
    const fileInput = el('input',{type:'file', accept:'image/*', id:'f-image-file'});
    const urlInput = el('input',{type:'text', id:'f-image', placeholder:'...or paste an image URL', value:pendingImage});
    photoControls.appendChild(fileInput);
    photoControls.appendChild(urlInput);
    photoControls.appendChild(el('div',{class:'meta'},['Upload a photo of the actual book, or paste a link. Keep uploaded photos reasonably small.']));
    photoRow.appendChild(photoControls);
    photoField.appendChild(photoRow);
    wrap.appendChild(photoField);

    function updatePreview(src){
      pendingImage = src||'';
      preview.src = pendingImage;
      preview.style.display = pendingImage ? 'block' : 'none';
      previewEmpty.style.display = pendingImage ? 'none' : 'flex';
    }
    fileInput.addEventListener('change', ()=>{
      const file = fileInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = e => { urlInput.value=''; updatePreview(e.target.result); };
      reader.readAsDataURL(file);
    });
    urlInput.addEventListener('input', ()=>{ fileInput.value=''; updatePreview(urlInput.value.trim()); });

    const actions = el('div',{style:'margin-top:16px; display:flex; gap:8px;'});
    const saveBtn = el('button',{class:'btn btn-primary'},[isNew?'Add book':'Save changes']);
    saveBtn.addEventListener('click', ()=>{
      const get = k => document.getElementById('f-'+k).value;
      const price = parseFloat(get('price')); const stock = parseInt(get('stock')||'0',10);
      const title = get('title').trim();
      if(!title || isNaN(price)){ showToast('Title and price are required'); return; }
      const book = {
        id: isNew ? null : existing.id,
        title, author:get('author').trim(), price, stock:isNaN(stock)?0:stock,
        format:get('format').trim(), edition:get('edition').trim(),
        shelf:get('shelf').trim(), image:pendingImage.trim(), condition:get('condition').trim()
      };
      saveBook(book);
    });
    actions.appendChild(saveBtn);
    actions.appendChild(el('button',{class:'btn btn-ghost', onclick:()=>setState({editingBook:null})},['Cancel']));
    wrap.appendChild(actions);
    return wrap;
  }

  function adminView(){
    const wrap = el('div');
    if(!state.adminUnlocked){
      const lock = el('div',{class:'lock-screen'});
      lock.appendChild(el('h2',{},['Admin access']));
      lock.appendChild(el('p',{class:'meta'},['Enter the store passcode to manage the catalog.']));
      const f = el('div',{class:'field'});
      const input = el('input',{type:'password', id:'admin-pass', placeholder:'Passcode'});
      f.appendChild(input);
      lock.appendChild(f);
      const btn = el('button',{class:'btn btn-primary', style:'width:100%; justify-content:center;'},['Unlock']);
      btn.addEventListener('click', ()=>{
        if(input.value===ADMIN_CODE){ setState({adminUnlocked:true}); }
        else showToast('Incorrect passcode');
      });
      input.addEventListener('keydown', e=>{ if(e.key==='Enter') btn.click(); });
      lock.appendChild(btn);
      lock.appendChild(el('p',{class:'meta', style:'margin-top:14px;'},['This is a light client-side gate for one shop-owner use — not secure enough for sensitive data.']));
      wrap.appendChild(lock);
      return wrap;
    }

    wrap.appendChild(el('div',{class:'page-head'},[
      el('div',{},[ el('h1',{},['Manage catalog']), el('p',{},['Add, edit, or remove books from the shop.']) ]),
      el('button',{class:'btn btn-primary', onclick:()=>setState({editingBook:'new'})},['+ Add book'])
    ]));

    if(state.editingBook){
      wrap.appendChild(bookForm(state.editingBook==='new'?null:state.editingBook));
      return wrap;
    }

    const panel = el('div',{class:'panel'});
    const table = el('table',{class:'admin-table'});
    const thead = el('tr',{},[ el('th',{},['Title']), el('th',{},['Price']), el('th',{},['Stock']), el('th',{},['Shelf']), el('th',{},['']) ]);
    table.appendChild(thead);
    if(state.books.length===0){
      panel.appendChild(el('div',{class:'empty'},[el('p',{},['No books yet — add your first one.'])]));
    }else{
      state.books.forEach(b=>{
        const tr = el('tr',{},[
          el('td',{},[b.title]),
          el('td',{},[peso(b.price)]),
          el('td',{},[String(b.stock)]),
          el('td',{},[b.shelf||'—'])
        ]);
        const actionsTd = el('td',{style:'text-align:right;'});
        const editBtn = el('button',{class:'btn btn-ghost btn-sm', onclick:()=>setState({editingBook:b})},['Edit']);
        const delBtn = el('button',{class:'btn btn-danger btn-sm', style:'margin-left:6px;', onclick:()=>{ if(confirm('Remove "'+b.title+'"?')) deleteBook(b.id); }},['Delete']);
        actionsTd.appendChild(editBtn); actionsTd.appendChild(delBtn);
        tr.appendChild(actionsTd);
        table.appendChild(tr);
      });
      panel.appendChild(table);
    }
    wrap.appendChild(panel);
    return wrap;
  }

  function ordersView(){
    const wrap = el('div');
    wrap.appendChild(el('div',{class:'page-head'},[ el('div',{},[ el('h1',{},['Orders']), el('p',{},['All orders placed through the shop.']) ]) ]));
    if(state.orders.length===0){
      wrap.appendChild(el('div',{class:'panel'},[ el('div',{class:'empty'},[ el('h3',{},['No orders yet']) ]) ]));
      return wrap;
    }
    state.orders.forEach(o=>{
      const card = el('div',{class:'order-card'});
      const head = el('div',{class:'order-head'},[
        el('div',{},[ el('div',{class:'order-id'},[o.id]), el('div',{class:'meta'},[new Date(o.createdAt).toLocaleString()]) ]),
        el('span',{class:'status-pill status-'+o.status},[o.status])
      ]);
      card.appendChild(head);
      const body = el('div',{class:'order-body'});
      body.appendChild(el('div',{style:'margin-bottom:8px;'},[el('b',{},[o.buyerName]), ' · ', o.contact]));
      body.appendChild(el('div',{class:'meta', style:'margin-bottom:8px;'},[o.address]));
      o.items.forEach(i=>{
        body.appendChild(el('div',{class:'line'},[ i.title+' × '+i.qty, peso(i.price*i.qty) ]));
      });
      body.appendChild(el('div',{class:'line', style:'font-weight:700; color:var(--ink); border-top:1px solid var(--line); margin-top:6px; padding-top:8px;'},[ 'Total via '+o.paymentMode, peso(o.total) ]));
      card.appendChild(body);
      if(state.adminUnlocked){
        const actions = el('div',{class:'order-actions'});
        ['Pending','Paid','Shipped','Cancelled'].forEach(s=>{
          if(s===o.status) return;
          actions.appendChild(el('button',{class:'btn btn-ghost btn-sm', onclick:()=>setOrderStatus(o.id,s)},['Mark '+s]));
        });
        card.appendChild(actions);
      }
      wrap.appendChild(card);
    });
    return wrap;
  }

  // ---------- main render ----------
  function render(){
    const root = document.getElementById('root');
    root.innerHTML = '';
    const app = el('div',{class:'app'});

    const spine = el('div',{class:'spine'});
    spine.appendChild(el('div',{class:'brand'},[
      el('div',{class:'brand-mark'},['BookNest']),
      el('div',{class:'brand-sub'},['PRE-LOVED BOOKS'])
    ]));
    spine.appendChild(navItem('shop','Shop'));
    spine.appendChild(navItem('cart','Cart', cartCount()||null));
    spine.appendChild(navItem('orders','Orders'));
    spine.appendChild(navItem('payment','Payment info'));
    if(ADMIN_PARAM || state.adminUnlocked){ spine.appendChild(navItem('admin','Admin')); }
    spine.appendChild(el('div',{class:'spine-footer'},['© '+new Date().getFullYear()+' BookNest']));
    app.appendChild(spine);

    const main = el('div',{class:'main'});
    if(state.view==='shop') main.appendChild(shopView());
    else if(state.view==='cart') main.appendChild(cartView());
    else if(state.view==='confirm') main.appendChild(confirmView());
    else if(state.view==='payment') main.appendChild(paymentInfoView());
    else if(state.view==='admin') main.appendChild(adminView());
    else if(state.view==='orders') main.appendChild(ordersView());
    app.appendChild(main);

    root.appendChild(app);

    const modal = checkoutModal();
    if(modal) root.appendChild(modal);

    if(state.toast){
      const t = el('div',{style:'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--white); padding:10px 18px; border-radius:4px; font-size:13.5px; z-index:100;'},[state.toast]);
      root.appendChild(t);
    }
  }

  render();
})();
</script>
</body>
</html>
