<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="performance.js" defer></script>
    <title>BookNest</title>
    <style>
      :root{
        --spine:#35493C;
        --spine-dark:#263329;
        --paper:#EFE7D8;
        --brick:#A8402A;
        --brick-dark:#8A3220;
        --ink:#26211A;
        --ink-soft:#5B5344;
        --white:#FFFDF8;
      }
      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;height:100%;}
      body{
        font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
        background:linear-gradient(160deg, var(--spine), var(--spine-dark));
        color:var(--white);
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
      }
      .landing{
        width:100%;
        max-width:640px;
        text-align:center;
      }
      .brand-mark{
        font-family:Georgia,'Times New Roman',serif;
        font-style:italic;
        font-weight:600;
        font-size:40px;
        margin-bottom:6px;
      }
      .brand-sub{
        font-size:12.5px;
        letter-spacing:0.08em;
        text-transform:uppercase;
        color:rgba(255,255,255,0.6);
        margin-bottom:44px;
      }
      .choices{
        display:grid;
        grid-template-columns:minmax(0,420px);
        justify-content:center;
        gap:20px;
      }
      @media (max-width:520px){
        .choices{ grid-template-columns:1fr; }
      }
      .choice-card{
        background:var(--paper);
        color:var(--ink);
        border-radius:10px;
        padding:32px 22px;
        text-decoration:none;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:10px;
        transition:transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow:0 10px 30px rgba(0,0,0,0.18);
      }
      .choice-card:hover{
        transform:translateY(-3px);
        box-shadow:0 16px 40px rgba(0,0,0,0.28);
      }
      .choice-icon{ font-size:34px; }
      .choice-title{
        font-size:18px;
        font-weight:700;
      }
      .choice-desc{
        font-size:13px;
        color:var(--ink-soft);
        line-height:1.5;
      }
      .choice-card.buyer .choice-title{ color:var(--brick-dark); }
      .choice-card.buyer:hover{ background:#fff; }
      .choice-card.admin .choice-title{ color:var(--spine-dark); }
      .choice-card.admin:hover{ background:#fff; }
      .footer-note{
        margin-top:36px;
        font-size:12px;
        color:rgba(255,255,255,0.5);
      }
    </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-data.js"></script><script src="site-status.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="//cdn.jsdelivr.net">
</head>
  <body>
    <div class="landing">
      <div class="brand-mark">BookNest</div>
      <div class="brand-sub">HATCH A NEW WORLD , 1 PAGE AT A TIME</div>

      <div class="choices">
        <a class="choice-card buyer" href="buyer-login.html#login">
          <div class="choice-icon">🛒</div>
          <div class="choice-title">I'm a Buyer</div>
          <div class="choice-desc">Browse books, add to cart, and check out — no account needed.</div>
        </a>
      </div>

      <div class="footer-note">© <span id="year"></span> BookNest</div>
    </div>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="mobile-enhancements.js"></script>
</body>
</html>
